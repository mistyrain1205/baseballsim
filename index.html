<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本格派・野球試合シミュレーター (HOME vs AWAY)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1a4a75;
            margin-bottom: 20px;
        }
        /* スコアボード */
        .scoreboard {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            background: #1a202c;
            color: white;
            border-radius: 8px;
            overflow: hidden;
        }
        .scoreboard th, .scoreboard td {
            border: 1px solid #4a5568;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        .scoreboard th { background: #2d3748; color: #a0aec0; }
        .scoreboard td.runs { color: #ecc94b; font-size: 1.2em; }

        /* 試合中継ステータス表示 */
        .game-status-box {
            display: flex;
            justify-content: space-between;
            background: #fffaf0;
            border: 2px solid #feebc8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .status-item { font-size: 1.1em; }
        .diamond { color: #4a5568; font-size: 1.2em; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }
        .card h2 {
            margin-top: 0;
            color: #2c5282;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
            font-size: 1.2em;
        }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 3px; font-size: 0.85em; }
        input[type="number"] {
            width: 100%; padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box;
        }
        
        .btn-play {
            display: block; width: 100%; padding: 15px; background: #2b6cb0; color: white;
            border: none; border-radius: 6px; font-size: 1.3em; cursor: pointer; font-weight: bold;
            transition: background 0.2s; margin-bottom: 15px;
        }
        .btn-play:hover { background: #2c5282; }
        .btn-reset {
            display: block; width: 100%; padding: 8px; background: #e53e3e; color: white;
            border: none; border-radius: 6px; font-size: 0.9em; cursor: pointer; font-weight: bold;
            margin-bottom: 25px;
        }

        .result-box {
            margin-top: 25px; padding: 25px; background: #f7fafc; border: 2px solid #cbd5e0; border-radius: 8px;
        }
        .log {
            background: #1a202c; color: #fff; padding: 20px; border-radius: 6px;
            font-family: monospace; font-size: 1.1em; line-height: 1.6; margin-top: 15px;
            white-space: pre-wrap; max-height: 400px; overflow-y: auto;
        }
        .hit-badge { background: #e53e3e; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .barrel-badge { background: #d69e2e; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .error-badge { background: #b7791f; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>本格派・野球試合シミュレーター</h1>

    <table class="scoreboard">
        <thead>
            <tr>
                <th style="width: 150px;">チーム</th>
                <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th>
                <th style="width: 60px; background: #2d3748;">R</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>AWAY (先攻)</td>
                <td id="a1">-</td><td id="a2">-</td><td id="a3">-</td><td id="a4">-</td><td id="a5">-</td><td id="a6">-</td><td id="a7">-</td><td id="a8">-</td><td id="a9">-</td>
                <td id="away_runs" class="runs">0</td>
            </tr>
            <tr>
                <td>HOME (後攻)</td>
                <td id="h1">-</td><td id="h2">-</td><td id="h3">-</td><td id="h4">-</td><td id="h5">-</td><td id="h6">-</td><td id="h7">-</td><td id="h8">-</td><td id="h9">-</td>
                <td id="home_runs" class="runs">0</td>
            </tr>
        </tbody>
    </table>

    <div class="game-status-box">
        <div class="status-item" id="current_inning_text">試合前</div>
        <div class="status-item" id="outs_text">0 アウト</div>
        <div class="status-item" id="pitcher_status_text">先発投手: 0球</div>
        <div class="status-item diamond" id="runners_text">◆ ◆ ◆ (ランナーなし)</div>
    </div>

    <button class="btn-play" id="play_btn" onclick="playNextHalfInning()">次のイニングの攻撃を開始</button>
    <button class="btn-reset" onclick="resetGame()">試合をリセット</button>

    <div class="grid">
        <div class="card">
            <h2>打撃・チーム基準設定</h2>
            <div class="form-group"><label>基準四死球率 (%)</label><input type="number" id="base_bb" value="8.0" step="0.1"></div>
            <div class="form-group"><label>バレル率 (Barrel%)</label><input type="number" id="base_barrel" value="10.0" step="0.1"></div>
            <div class="form-group"><label>ゴロ (GB) %</label><input type="number" id="hit_gb" value="45"></div>
            <div class="form-group"><label>フライ (FB) %</label><input type="number" id="hit_fb" value="35"></div>
            <div class="form-group"><label>ライナー (LD) %</label><input type="number" id="hit_ld" value="20"></div>
        </div>

        <div class="card">
            <h2>投手・守備基準設定</h2>
            <div class="form-group"><label>先発投手 100球超の四死球率増加係数 (1球ごと%)</label><input type="number" id="p_fatigue" value="0.05" step="0.01"></div>
            <div class="form-group"><label>リリーフ投手 四死球率補正値 (先発の何倍コントロールが良いか。0.9で優秀)</label><input type="number" id="reliefe_factor" value="0.9" step="0.1"></div>
            <div class="form-group"><label>野手平均 UZR (守備範囲。高いほど安打阻止)</label><input type="number" id="team_uzr" value="2.0" step="0.5"></div>
            <div class="form-group"><label>野手平均 エラー率 (%)</label><input type="number" id="team_err" value="2.5" step="0.1"></div>
        </div>
    </div>

    <div class="result-box" id="resultArea" style="display:none;">
        <div class="result-title" id="log_title">イニング実況</div>
        <div class="log" id="simLog"></div>
    </div>
</div>

<script>
// --- 試合進行管理用の状態変数 ---
let inning = 1;         // 1〜9イニング
let isTop = true;       // true=表(AWAYの攻撃), false=裏(HOMEの攻撃)
let gameOver = false;

let awayScore = [0,0,0,0,0,0,0,0,0];
let homeScore = [0,0,0,0,0,0,0,0,0];

// 投手状態 (AWAY側、HOME側)
let pitcherState = {
    away: { name: "AWAY先発", balls: 0, runsAllowed: 0, isRelief: false, inningsPitchedThisRelief: 0 },
    home: { name: "HOME先発", balls: 0, runsAllowed: 0, isRelief: false, inningsPitchedThisRelief: 0 }
};

function resetGame() {
    inning = 1; isTop = true; gameOver = false;
    awayScore = [0,0,0,0,0,0,0,0,0]; homeScore = [0,0,0,0,0,0,0,0,0];
    pitcherState = {
        away: { name: "AWAY先発", balls: 0, runsAllowed: 0, isRelief: false, inningsPitchedThisRelief: 0 },
        home: { name: "HOME先発", balls: 0, runsAllowed: 0, isRelief: false, inningsPitchedThisRelief: 0 }
    };
    for(let i=1; i<=9; i++) {
        document.getElementById(`a${i}`).innerText = "-";
        document.getElementById(`h${i}`).innerText = "-";
    }
    document.getElementById("away_runs").innerText = "0";
    document.getElementById("home_runs").innerText = "0";
    document.getElementById("current_inning_text").innerText = "試合前";
    document.getElementById("outs_text").innerText = "0 アウト";
    document.getElementById("pitcher_status_text").innerText = "先発投手: 0球";
    document.getElementById("runners_text").innerText = "◆ ◆ ◆ (ランナーなし)";
    document.getElementById("play_btn").innerText = "次のイニングの攻撃を開始";
    document.getElementById("play_btn").disabled = false;
    document.getElementById("simLog").innerText = "";
    document.getElementById("resultArea").style.display = "none";
}

function playNextHalfInning() {
    if (gameOver) return;

    let offenseTeam = isTop ? "AWAY" : "HOME";
    let defenseTeam = isTop ? "HOME" : "AWAY";
    let currentPitcher = isTop ? pitcherState.home : pitcherState.away; // 攻撃の裏にいるのが防御側の投手

    // --- 【継投判定①】リリーフがすでに1イニング投げ切っていたら自動交代 (回またぎなし) ---
    if (currentPitcher.isRelief && currentPitcher.inningsPitchedThisRelief >= 1) {
        currentPitcher.name = `${defenseTeam}リリーフ`;
        currentPitcher.balls = 0;
        currentPitcher.inningsPitchedThisRelief = 0;
        alert(`${defenseTeam}は新しいリリーフ投手を投入します（回またぎ回避）。`);
    }

    let logText = `=== ${inning}回${isTop ? '表' : '裏'} 【${offenseTeam}の攻撃】 (投手: ${currentPitcher.name}, 通算${currentPitcher.balls}球) ===\n`;
    
    let outs = 0;
    let bases = [false, false, false]; // 一塁, 二塁, 三塁
    let inningRuns = 0;

    // パラメータ取得
    const base_bb = parseFloat(document.getElementById('base_bb').value) / 100;
    const base_barrel = parseFloat(document.getElementById('base_barrel').value) / 100;
    const gb_p = parseFloat(document.getElementById('hit_gb').value);
    const fb_p = parseFloat(document.getElementById('hit_fb').value);
    const ld_p = parseFloat(document.getElementById('hit_ld').value);
    const team_uzr = parseFloat(document.getElementById('team_uzr').value);
    const team_err = parseFloat(document.getElementById('team_err').value) / 100;
    const p_fatigue = parseFloat(document.getElementById('p_fatigue').value) / 100;
    const reliefe_factor = parseFloat(document.getElementById('reliefe_factor').value);

    // 1半イニングのシミュレート（3アウトになるまで）
    while (outs < 3) {
        // 現在ピンチ（得点圏にランナーがいる）かどうかの判定
        let isScoringPosition = bases[1] || bases[2];

        // --- 【継投判定②】先発が100球以上投げていてピンチを迎えたら即リリーフへ交代 ---
        if (!currentPitcher.isRelief && currentPitcher.balls >= 100 && isScoringPosition) {
            logText += `\n🚨 【投手交代】先発が100球を超え、ピンチを迎えたためノックアウト！ リリーフ投手をマウンドに送ります。\n\n`;
            currentPitcher.name = `${defenseTeam}リリーフ`;
            currentPitcher.balls = 0;
            currentPitcher.isRelief = true;
            currentPitcher.inningsPitchedThisRelief = 0;
            currentPitcher.runsAllowed = 0; 
        }

        // 消費球数算出 (1〜6球)
        let abBalls = Math.floor(Math.random() * 6) + 1;
        currentPitcher.balls += abBalls;

        // 四死球確率の計算（投手特性・疲労反映）
        let p_bb_calc = base_bb;
        if (currentPitcher.isRelief) {
            p_bb_calc = base_bb * reliefe_factor; // リリーフはコントロールが良い
        } else if (currentPitcher.balls > 100) {
            p_bb_calc += (currentPitcher.balls - 100) * p_fatigue; // 先発の疲労
        }

        // 簡易対数オッズ（同能力対決を想定し投手の補正のみ反映）
        let final_bb_prob = Math.max(0.02, Math.min(0.4, p_bb_calc));

        logText += `[通算${currentPitcher.balls}球目] `;

        if (Math.random() < final_bb_prob) {
            // 四死球で出塁
            logText += `🟢 四死球: 出塁します。\n`;
            let runsGained = advanceRunners(bases, "BB");
            inningRuns += runsGained;
            currentPitcher.runsAllowed += runsGained;
        } else {
            // 打球発生
            let rand_type = Math.random() * (gb_p + fb_p + ld_p);
            let hitType = rand_type < gb_p ? "GB" : (rand_type < gb_p + fb_p ? "FB" : "LD");
            
            // バレル判定
            if ((hitType === "FB" || hitType === "LD") && Math.random() < base_barrel) {
                logText += `🔥 <span class="barrel-badge">バレル炸裂!!</span> 特大の本塁打！\n`;
                let runsGained = advanceRunners(bases, "HR");
                inningRuns += runsGained;
                currentPitcher.runsAllowed += runsGained;
            } else {
                // 通常打球の安打・アウト・エラー判定
                let baseHitChance = hitType === "GB" ? 0.24 : (hitType === "FB" ? 0.15 : 0.68);
                let defenseCorrection = - (team_uzr * 0.005);
                let finalHitChance = Math.max(0.02, Math.min(0.95, baseHitChance + defenseCorrection));

                if (Math.random() < finalHitChance) {
                    // ヒット
                    let hitKind = Math.random() < 0.2 ? "2B" : "1B"; // 2割で二塁打
                    logText += `🔥 <span class="hit-badge">ヒット [${hitType}]</span>: 快音を残して安打！\n`;
                    let runsGained = advanceRunners(bases, hitKind);
                    inningRuns += runsGained;
                    currentPitcher.runsAllowed += runsGained;
                } else {
                    // 守備範囲内。エラー判定
                    if (Math.random() < team_err) {
                        logText += `⚠️ <span class="error-badge">失策 (Error)</span>: 守備陣が手につき落球、または悪送球！出塁。\n`;
                        let runsGained = advanceRunners(bases, "1B");
                        inningRuns += runsGained;
                        currentPitcher.runsAllowed += runsGained;
                    } else {
                        // 通常アウト
                        outs++;
                        logText += `❌ アウト (${outs}アウト) [${hitType}]\n`;
                    }
                }
            }
        }

        // --- 【継投判定③】合計6失点（先発・リリーフ問わず）でノックアウトされ強制交代 ---
        if (currentPitcher.runsAllowed >= 6) {
            logText += `\n💥 【投手ノックアウト】合計6失点に達したため、緊急の投手交代を行います！\n\n`;
            currentPitcher.name = `${defenseTeam}リリーフ`;
            currentPitcher.balls = 0;
            currentPitcher.isRelief = true;
            currentPitcher.inningsPitchedThisRelief = 0;
            currentPitcher.runsAllowed = 0; 
        }
    }

    // イニング終了処理
    logText += `\nチェンジ！ このイニングの得点: ${inningRuns}\n`;

    // スコアの記録
    if (isTop) {
        awayScore[inning - 1] = inningRuns;
        document.getElementById(`a${inning}`).innerText = inningRuns;
    } else {
        homeScore[inning - 1] = inningRuns;
        document.getElementById(`h${inning}`).innerText = inningRuns;
    }

    // 総得点の更新
    let totalAway = awayScore.reduce((a,b)=>a+b, 0);
    let totalHome = homeScore.reduce((a,b)=>a+b, 0);
    document.getElementById("away_runs").innerText = totalAway;
    document.getElementById("home_runs").innerText = totalHome;

    // リリーフのイニング消化カウントをプラス（1イニング終了）
    if (currentPitcher.isRelief) {
        currentPitcher.inningsPitchedThisRelief++;
    }

    // --- 【継投判定④】先発が105球以上投げてイニングを終えたら、次のイニングからリリーフへ交代 ---
    if (!currentPitcher.isRelief && currentPitcher.balls >= 105) {
        currentPitcher.name = `${defenseTeam}リリーフ`;
        currentPitcher.balls = 0;
        currentPitcher.isRelief = true;
        currentPitcher.inningsPitchedThisRelief = 0;
        currentPitcher.runsAllowed = 0;
        logText += `\n📢 【次イニング予告】${defenseTeam}の先発投手は105球を超えたため、このイニングでマウンドを降ります。次からリリーフが登板します。\n`;
    }

    // ログ画面への反映
    document.getElementById("simLog").innerHTML = logText;
    document.getElementById("resultArea").style.display = "block";

    // 試合終了判定（9回裏終了、またはサヨナラなど）
    checkGameOver(totalAway, totalHome);

    // 次のイニングへ進める処理
    if (!gameOver) {
        if (isTop) {
            isTop = false; // 裏の攻撃へ
        } else {
            isTop = true; inning++; // 次の回の表へ
        }
        updateStatusDisplay();
    }
}

// ランナーを進める処理関数（得点数を返す）
function advanceRunners(bases, hitKind) {
    let runs = 0;
    if (hitKind === "BB") {
        // 押し出しの判定
        if (bases[0] && bases[1] && bases[2]) { runs++; }
        else if (bases[0] && bases[1]) { bases[2] = true; }
        else if (bases[0]) { bases[1] = true; }
        bases[0] = true;
    } else if (hitKind === "1B") {
        if (bases[2]) { runs++; bases[2] = false; }
        if (bases[1]) { bases[2] = true; bases[1] = false; }
        if (bases[0]) { bases[1] = true; }
        bases[0] = true;
    } else if (hitKind === "2B") {
        if (bases[2]) { runs++; bases[2] = false; }
        if (bases[1]) { runs++; bases[1] = false; }
        if (bases[0]) { bases[2] = true; bases[0] = false; }
        bases[1] = true;
    } else if (hitKind === "HR") {
        runs += 1 + (bases[0]?1:0) + (bases[1]?1:0) + (bases[2]?1:0);
        bases[0] = false; bases[1] = false; bases[2] = false;
    }
    return runs;
}

function updateStatusDisplay() {
    document.getElementById("current_inning_text").innerText = `${inning}回${isTop ? '表' : '裏'}`;
    document.getElementById("outs_text").innerText = "0 アウト";
    let nextPitcher = isTop ? pitcherState.home : pitcherState.away;
    document.getElementById("pitcher_status_text").innerText = `対戦投手: ${nextPitcher.name} (${nextPitcher.balls}球)`;
    document.getElementById("runners_text").innerText = "◆ ◆ ◆ (ランナーなし)";
    document.getElementById("play_btn").innerText = `${inning}回${isTop ? '表 (AWAY攻撃)' : '裏 (HOME攻撃)'} をシミュレート`;
}

function checkGameOver(away, home) {
    // 9回表終了時にHOMEが勝っている、または9回裏終了時
    if (inning >= 9) {
        if (isTop && home > away) {
            endGame(`試合終了！ ${home} - ${away} で HOMEチームの勝利！ (9回表コールド)`);
            return;
        }
        if (!isTop) {
            if (home > away) {
                endGame(`試合終了！ ${home} - ${away} で HOMEチームのサヨナラ勝利！`);
            } else if (away > home) {
                endGame(`試合終了！ ${away} - ${home} で AWAYチームの勝利！`);
            } else {
                endGame(`試合終了！ ${away} - ${home} で 引き分けです！`);
            }
            return;
        }
    }
}

function endGame(message) {
    gameOver = true;
    document.getElementById("current_inning_text").innerText = "試合終了";
    document.getElementById("play_btn").innerText = "試合が終了しました";
    document.getElementById("play_btn").disabled = true;
    document.getElementById("simLog").innerHTML += `\n👑 <b>${message}</b>`;
}
</script>

</body>
</html>
