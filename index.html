<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - 完全自動シミュレーター</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #2d3748; color: white; padding: 8px; font-size: 0.8em; }
        td { padding: 6px; border: 1px solid #ddd; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h1>全自動シーズンシミュレーター</h1>
    <button onclick="runFullSeason()" style="padding: 15px; font-size: 1.2em; background: #e53e3e; color: white; border: none;">シーズンを全自動シミュレート</button>
    <div id="status">完了後、成績が表示されます。</div>

    <div class="grid">
        <div><h2>野手成績リーダー</h2><table id="bat_table"><thead><tr><th>名前</th><th>打率</th><th>HR</th><th>WAR</th></tr></thead><tbody></tbody></table></div>
        <div><h2>投手成績リーダー</h2><table id="pit_table"><thead><tr><th>名前</th><th>防御率</th><th>回</th><th>WAR</th></tr></thead><tbody></tbody></table></div>
    </div>
</div>

<script>
// 簡易データ初期化
const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];
let teams = teamNames.map(name => ({
    name, wins: 0, losses: 0,
    batters: Array.from({length: 9}, (_, i) => ({ name: "打者"+(i+1), stats: { ab: 0, hits: 0, hr: 0, bb: 0, so: 0 } })),
    pitchers: Array.from({length: 6}, (_, i) => ({ name: "投手"+(i+1), role: i<5?"先発":"守護神", stats: { ipOuts: 0, er: 0, so: 0, wins: 0 } }))
}));

// 1打席の完全計算
function simulateAtBat(batter, pitcher) {
    let roll = Math.random() * 100;
    if (roll < 10) return "BB"; // 四球
    if (roll < 30) return "SO"; // 三振
    if (roll < 50) return "HR"; // 本塁打
    if (roll < 70) return "1B"; // 安打
    return "OUT";
}

// 1試合の完全シミュレート
function simulateMatch(away, home) {
    let innings = 9;
    let scoreAway = 0, scoreHome = 0;
    
    for (let i = 0; i < innings; i++) {
        [ {t: away, p: home.pitchers[0]}, {t: home, p: away.pitchers[0]} ].forEach(half => {
            let outs = 0;
            while (outs < 3) {
                let res = simulateAtBat(half.t.batters[Math.floor(Math.random()*9)], half.p);
                if (res === "SO") { outs++; half.p.stats.so++; }
                else if (res === "HR") { if(half.t === away) scoreAway++; else scoreHome++; }
                else if (res === "1B") half.t.batters[Math.floor(Math.random()*9)].stats.hits++;
                else outs++;
            }
        });
    }
    if (scoreAway > scoreHome) away.wins++; else home.wins++;
}

// シーズン実行
function runFullSeason() {
    for (let i = 0; i < 143; i++) {
        simulateMatch(teams[0], teams[1]); // 今回は簡易的に2チーム対戦
    }
    document.getElementById("status").innerText = "シーズン終了！全成績を更新しました。";
    updateUI();
}

function updateUI() {
    document.querySelector("#bat_table tbody").innerHTML = teams[0].batters.map(b => 
        `<tr><td>${b.name}</td><td>${(b.stats.hits/Math.max(b.stats.ab,1)).toFixed(3)}</td><td>${b.stats.hr}</td><td>${(b.stats.hits*0.1).toFixed(1)}</td></tr>`
    ).join("");
    document.querySelector("#pit_table tbody").innerHTML = teams[0].pitchers.map(p => 
        `<tr><td>${p.name}</td><td>${(p.stats.er*9/Math.max(p.stats.ipOuts/3,1)).toFixed(2)}</td><td>${(p.stats.ipOuts/3).toFixed(1)}</td><td>${(p.stats.so*0.05).toFixed(1)}</td></tr>`
    ).join("");
}
</script>
</body>
</html>
