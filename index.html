<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本格派・プロ野球6球団ペナンシミュレーター & エディタ (守護神・セーブ実装版)</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #1a4a75; margin-top: 0; }
        
        .menu-grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 10px 18px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; font-size: 0.9em; }
        .btn-primary { background: #2b6cb0; }
        .btn-success { background: #2f855a; }
        .btn-danger { background: #c53030; }
        .btn-warning { background: #dd6b20; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.82em; }
        th, td { border: 1px solid #cbd5e0; padding: 5px; text-align: center; }
        th { background: #2d3748; color: white; }
        tr:nth-child(even) { background-color: #f8fafc; }
        
        .tabs { display: flex; background: #e2e8f0; padding: 5px 5px 0 5px; border-radius: 6px 6px 0 0; gap: 4px; }
        .tab { padding: 8px 14px; cursor: pointer; font-weight: bold; border-radius: 4px 4px 0 0; background: #edf2f7; font-size: 0.85em; }
        .tab.active { background: white; color: #2b6cb0; border: 1px solid #cbd5e0; border-bottom: none; }
        .tab-content { display: none; background: white; border: 1px solid #cbd5e0; padding: 15px; border-radius: 0 0 6px 6px; }
        .tab-content.active { display: block; }

        .editor-box { display: grid; grid-template-columns: 180px 180px 1fr; gap: 15px; background: #fff; padding: 15px; border-radius: 6px; border: 1px solid #cbd5e0; }
        .editor-pane { display: flex; flex-direction: column; gap: 8px; }
        .list-select { width: 100%; height: 280px; border: 1px solid #cbd5e0; border-radius: 4px; padding: 5px; font-size: 0.9em; }
        .form-row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 0.85em; }
        .form-row input, .form-row select { padding: 5px; border: 1px solid #cbd5e0; border-radius: 4px; width: 100%; box-sizing: border-box; }
        
        .warning-text { color: #c53030; font-weight: bold; font-size: 0.85em; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>本格派・プロ野球6球団ペナンシミュレーター & エディタ</h1>
    
    <div class="card" style="text-align:center; margin-bottom:20px; background:#ebf8ff; border: 2px solid #bee3f8;">
        <h2>リーグ消化状況: <span id="current_game_count">0</span> / 143 試合 (第 <span id="current_week_count">1</span> 週目)</h2>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="playNextRound()">1カード (3試合) 消化</button>
            <button class="btn btn-success" onclick="playOneWeek()">1週間 (6試合) まとめて進行</button>
            <button class="btn btn-warning" onclick="playAllSeason()">シーズン終了まで高速スキップ</button>
            <button class="btn btn-danger" onclick="resetSeason()">ペナントをリセット</button>
        </div>
    </div>

    <div class="menu-grid">
        <div class="card">
            <h2>リーグ順位表</h2>
            <table>
                <thead>
                    <tr><th>順位</th><th>チーム</th><th>勝</th><th>敗</th><th>分</th><th>勝率</th><th>差</th></tr>
                </thead>
                <tbody id="standings_body"></tbody>
            </table>
            
            <h3 style="margin-top:20px;">直近の試合結果</h3>
            <table style="font-size: 0.78em;">
                <tbody id="quick_match_results">
                    <tr><td colspan="2">試合を進行してください</td></tr>
                </tbody>
            </table>

            <h3 style="margin-top:25px;">スタジアム環境設定</h3>
            <div style="font-size:0.85em; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0;">
                <div class="form-row"><label>ゴロ (GB) %</label><input type="number" id="hit_gb" value="45"></div>
                <div class="form-row"><label>フライ (FB) %</label><input type="number" id="hit_fb" value="35"></div>
                <div class="form-row"><label>ライナー (LD) %</label><input type="number" id="hit_ld" value="20"></div>
            </div>
        </div>

        <div class="card" style="padding: 10px;">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('tab-stats-bat', this)">個人打撃成績</div>
                <div class="tab" onclick="switchTab('tab-stats-pit', this)">個人投手成績</div>
                <div class="tab" onclick="switchTab('tab-editor', this)">🛠️ チーム・選手能力編集</div>
            </div>

            <div id="tab-stats-bat" class="tab-content active">
                <h3>打撃個人成績ランキング（上位15名）</h3>
                <table id="batting_stats_table">
                    <thead>
                        <tr><th>球団</th><th>選手名</th><th>守備</th><th>打率</th><th>試合</th><th>打数</th><th>安打</th><th>本塁打</th><th>打点</th><th>四球</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="tab-stats-pit" class="tab-content">
                <h3>投手個人成績ランキング（防御率順）</h3>
                <table id="pitching_stats_table">
                    <thead>
                        <tr><th>球団</th><th>選手名</th><th>役割</th><th>防御率</th><th>登板</th><th>勝</th><th>敗</th><th>セーブ</th><th>投球回</th><th>奪三振</th><th>残りSTA</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="tab-editor" class="tab-content">
                <h3>フロント采配・ロスター能力エディタ</h3>
                <div class="editor-box">
                    <div class="editor-pane">
                        <label style="font-weight:bold; font-size:0.85em;">① 球団選択</label>
                        <select id="edit_team_select" class="list-select" size="6" onchange="onEditorTeamChange()">
                            <option value="0" selected>大阪ゴールドバザーズ</option>
                            <option value="1">東京ネオシティズ</option>
                            <option value="2">横浜ベイスターズ風</option>
                            <option value="3">西海マリナーズ</option>
                            <option value="4">京都ハロンズ</option>
                            <option value="5">浪速タイクーンズ</option>
                        </select>
                    </div>
                    
                    <div class="editor-pane">
                        <label style="font-weight:bold; font-size:0.85em;">② 登録選手選択</label>
                        <select id="edit_player_select" class="list-select" size="15" onchange="onEditorPlayerChange()">
                        </select>
                    </div>
                    
                    <div class="editor-pane" style="background:#f8fafc; padding:10px; border-radius:4px; border:1px solid #e2e8f0;">
                        <label style="font-weight:bold; border-bottom:1px solid #cbd5e0; padding-bottom:3px; margin-bottom:10px;">③ ステータス書き換え</label>
                        <div id="editor_form_inner">
                            <div class="form-row"><label>選手名</label><input type="text" id="form_name"></div>
                            <div class="form-row">
                                <label>起用法/打順</label>
                                <select id="form_role">
                                    <option value="1番">1番打者</option><option value="2番">2番打者</option>
                                    <option value="3番">3番打者</option><option value="4番">4番打者</option>
                                    <option value="5番">5番打者</option><option value="6番">6番打者</option>
                                    <option value="7番">7番打者</option><option value="8番">8番打者</option>
                                    <option value="9番">9番打者</option><option value="控え">ベンチ控え</option>
                                    <option value="先発">先発ローテ</option><option value="リリーフ">中継ぎ</option>
                                    <option value="守護神">守護神(抑え)</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <label>割り当て守備</label>
                                <select id="form_pos">
                                    <option value="捕手">捕手</option><option value="一塁手">一塁手</option>
                                    <option value="二塁手">二塁手</option><option value="三塁手">三塁手</option>
                                    <option value="遊撃手">遊撃手</option><option value="左翼手">左翼手</option>
                                    <option value="中堅手">中堅手</option><option value="右翼手">右翼手</option>
                                    <option value="投手">投手</option>
                                </select>
                            </div>
                            
                            <div id="form_bat_stats">
                                <div class="form-row"><label>選球眼 (BB%)</label><input type="number" id="form_bb" step="0.5"></div>
                                <div class="form-row"><label>三振しにくさ(SO%)</label><input type="number" id="form_so" step="0.5"></div>
                                <div class="form-row"><label>バレル率 (%)</label><input type="number" id="form_barrel" step="0.5"></div>
                                <div class="form-row"><label>長打指標 (IsoP)</label><input type="number" id="form_isop"></div>
                                <div class="form-row"><label>守備範囲 (UZR)</label><input type="number" id="form_uzr" step="0.5"></div>
                                <div class="form-row"><label>エラー率 (%)</label><input type="number" id="form_err" step="0.1"></div>
                            </div>
                            <div id="form_pit_stats" style="display:none;">
                                <div class="form-row"><label>H/9 (被安打抑制)</label><input type="number" id="form_h9"></div>
                                <div class="form-row"><label>K/9 (奪三振力)</label><input type="number" id="form_k9"></div>
                                <div class="form-row"><label>BB/9 (与四球抑制)</label><input type="number" id="form_bb9"></div>
                                <div class="form-row"><label>HR/9 (被弾抑制)</label><input type="number" id="form_hr9"></div>
                                <div class="form-row"><label>STA (スタミナ)</label><input type="number" id="form_sta"></div>
                            </div>
                            
                            <button class="btn btn-success" style="width:100%; margin-top:10px;" onclick="saveEditorData()">編集内容を選手情報へ適用</button>
                            <div class="warning-text" id="editor_dup_warning">⚠️ 警告: 同一チーム内でポジション設定が重複、または不足しています！</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const positions = ["捕手", "一塁手", "二塁手", "三塁手", "遊撃手", "左翼手", "中堅手", "右翼手", "投手"];
const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];

let totalGamesPlayed = 0;
const MAX_GAMES = 143;
let teams = [];

function initializeLeagueData() {
    teams = [];
    for(let t=0; t<6; t++) {
        let teamObj = {
            id: t,
            name: teamNames[t],
            wins: 0, losses: 0, draws: 0,
            rotationIdx: 0,
            batters: [],
            pitchers: []
        };
        
        for(let i=1; i<=16; i++) {
            let isStamen = i <= 9;
            let pos = ["捕手","一塁手","二塁手","三塁手","遊撃手","左翼手","中堅手","右翼手","一塁手","捕手","内野手","内野手","外野手","外野手","外野手","内野手"][i-1];
            teamObj.batters.push({
                id: i-1,
                name: `${teamNames[t]}・野手${i}`,
                role: isStamen ? `${i}番` : "控え",
                originalPos: pos,
                currentPos: pos,
                bb: isStamen ? [11, 9, 12, 15, 10, 8, 7, 7, 5][i-1] : 7.0,
                so: isStamen ? [14, 16, 15, 20, 18, 22, 23, 25, 30][i-1] : 22.0,
                barrel: isStamen ? [7, 8, 16, 24, 14, 11, 9, 7, 5][i-1] : 6.0,
                isop: isStamen ? [12, 15, 26, 40, 20, 18, 15, 11, 6][i-1] : 12,
                uzr: isStamen ? [3, 4, 1.5, 1.0, 3.5, 0, 1, 0.5, 0][i-1] : 0,
                err: 2.0,
                stats: { games: 0, ab: 0, hits: 0, hr: 0, rbi: 0, bb: 0, so: 0 }
            });
        }
        
        for(let i=1; i<=12; i++) {
            let isStarter = i <= 5;
            let isCloser = i === 12; // 12人目を守護神に設定
            teamObj.pitchers.push({
                id: i-1,
                name: `${teamNames[t]}・${isCloser ? '守護神' : (isStarter ? '投手' + i : '中継ぎ' + (i-5))}`,
                role: isCloser ? "守護神" : (isStarter ? "先発" : "リリーフ"),
                currentPos: "投手",
                originalPos: "投手",
                h9: isCloser ? 85 : (isStarter ? 60 + i : 65 + (i-5)), // 守護神は基本ステータスを強力に設定
                k9: isCloser ? 88 : (isStarter ? 65 - i : 70 + (i-5)),
                bb9: isCloser ? 80 : (isStarter ? 70 : 65),
                hr9: isCloser ? 80 : (isStarter ? 60 : 65),
                staMax: isCloser ? 25 : (isStarter ? 95 : 35),
                staCurrent: isCloser ? 25 : (isStarter ? 95 : 35),
                stats: { era: 0, appearances: 0, wins: 0, losses: 0, saves: 0, ipOuts: 0, so: 0, bb: 0, er: 0 }
            });
        }
        teams.push(teamObj);
    }
}

function getDynamicSchedule(roundCount) {
    let numTeams = 6;
    let totalRounds = numTeams - 1; 
    let currentRound = roundCount % totalRounds;

    let pairings = [];
    let list = [0, 1, 2, 3, 4, 5];

    for (let i = 0; i < numTeams / 2; i++) {
        let awayIdx = (currentRound + i) % (numTeams - 1);
        let homeIdx = (numTeams - 1 - i + currentRound) % (numTeams - 1);
        if (i === 0) homeIdx = numTeams - 1; 
        pairings.push([list[awayIdx], list[homeIdx]]);
    }
    return pairings;
}

function simulateRound() {
    if(totalGamesPlayed >= MAX_GAMES) return null;
    let pattern = getDynamicSchedule(totalGamesPlayed);
    let roundResults = [];

    pattern.forEach(pair => {
        let teamAway = teams[pair[0]];
        let teamHome = teams[pair[1]];
        let res = executeMatchLogic(teamAway, teamHome);
        roundResults.push(res);
    });

    teams.forEach(t => {
        t.pitchers.forEach(p => {
            // 登板なし時のスタミナ回復量を調整
            if(p.staCurrent < p.staMax) p.staCurrent = Math.min(p.staMax, p.staCurrent + 8);
        });
    });

    totalGamesPlayed++;
    return roundResults;
}

// 守護神(セーブシチュエーション)AIを組み込んだ試合計算ロジック
function executeMatchLogic(away, home) {
    let pAway = away.pitchers.filter(p => p.role === "先発")[away.rotationIdx % 5];
    let pHome = home.pitchers.filter(p => p.role === "先発")[home.rotationIdx % 5];
    
    pAway.staCurrent = pAway.staMax;
    pHome.staCurrent = pHome.staMax;
    
    let curPitcherAway = pAway;
    let curPitcherHome = pHome;
    
    curPitcherAway.stats.appearances++;
    curPitcherHome.stats.appearances++;

    let appearedAway = [pAway.name];
    let appearedHome = [pHome.name];

    let awayScore = 0, homeScore = 0;
    let awayOrder = 0, homeOrder = 0;
    let pitchCountAway = 0, pitchCountHome = 0;

    let curPitcherAwayErInMatch = 0;
    let curPitcherHomeErInMatch = 0;
    let currentInningOutsAway = 0; 
    let currentInningOutsHome = 0; 

    // セーブ条件達成フラグ保持用
    let potentialSaverAway = null;
    let potentialSaverHome = null;

    for (let inning = 1; inning <= 9; inning++) {
        currentInningOutsAway = 0;
        currentInningOutsHome = 0;

        // 表の攻撃 (AWAY攻撃 vs HOMEの投手陣)
        let outs = 0; let bases = [false, false, false];
        while (outs < 3) {
            let needChange = false;
            
            // 【新ロジック】9回表、HOMEチームが1〜3点リード、または同点なら守護神を投入
            if (inning === 9 && curPitcherHome.role !== "守護神") {
                let scoreDiff = homeScore - awayScore;
                if (scoreDiff >= 0 && scoreDiff <= 3) {
                    let closer = home.pitchers.find(p => p.role === "守護神" && p.staCurrent >= 10);
                    if (closer) {
                        curPitcherHome = closer;
                        needChange = false; // 以下の通常リリーフ判定をスキップ
                        if (!appearedHome.includes(curPitcherHome.name)) {
                            curPitcherHome.stats.appearances++;
                            appearedHome.push(curPitcherHome.name);
                            potentialSaverHome = curPitcherHome; // セーブ機会の記録
                        }
                        pitchCountHome = 0; curPitcherHomeErInMatch = 0; currentInningOutsHome = 0;
                    }
                }
            }

            // 通常の投手交代判定
            if (curPitcherHome.role !== "守護神") {
                if (inning <= 5) {
                    if (pitchCountHome >= curPitcherHome.staMax || curPitcherHomeErInMatch >= 6) needChange = true;
                } else {
                    if (curPitcherHome.role === "先発") {
                        if (pitchCountHome >= curPitcherHome.staMax || curPitcherHomeErInMatch >= 4) needChange = true;
                    } else {
                        if (currentInningOutsHome >= 3 || curPitcherHomeErInMatch >= 3 || pitchCountHome >= curPitcherHome.staMax) needChange = true;
                    }
                }
            } else {
                // 守護神がすでにマウンドにいるが炎上した場合の緊急避難
                if (curPitcherHomeErInMatch >= 3) needChange = true;
            }

            if (needChange) {
                let availableReliefs = home.pitchers.filter(p => p.role === "リリーフ" && p.staCurrent > 15);
                if (availableReliefs.length > 0) {
                    availableReliefs.sort((a, b) => a.stats.appearances - b.stats.appearances);
                    curPitcherHome = availableReliefs[0];
                    if (!appearedHome.includes(curPitcherHome.name)) {
                        curPitcherHome.stats.appearances++;
                        appearedHome.push(curPitcherHome.name);
                    }
                    pitchCountHome = 0; curPitcherHomeErInMatch = 0; currentInningOutsHome = 0;
                }
            }
            
            let currentBatters = away.batters.filter(bat => bat.role !== "控え" && bat.role.includes("番"));
            let b = currentBatters[awayOrder];
            
            if(!b) {
                outs++; curPitcherHome.stats.ipOuts++; currentInningOutsHome++;
                awayOrder = (awayOrder + 1) % (currentBatters.length || 9);
                continue;
            }

            b.stats.ab++; pitchCountHome += 4;
            let bbP = (b.bb/100) + ((100 - curPitcherHome.bb9)*0.0004);
            let soP = (b.so/100) + (curPitcherHome.k9*0.0007);
            let rand = Math.random();
            
            if(rand < bbP) {
                b.stats.bb++; curPitcherHome.stats.bb++;
                let runs = advanceRunners(bases, "BB");
                awayScore += runs; curPitcherHome.stats.er += runs; curPitcherHomeErInMatch += runs; b.stats.rbi += runs;
            } else if(rand < bbP + soP) {
                outs++; b.stats.so++; curPitcherHome.stats.so++;
                curPitcherHome.stats.ipOuts++; currentInningOutsHome++; 
            } else {
                const gb_p = parseFloat(document.getElementById('hit_gb').value);
                const fb_p = parseFloat(document.getElementById('hit_fb').value);
                const ld_p = parseFloat(document.getElementById('hit_ld').value);
                let rand_type = Math.random() * (gb_p + fb_p + ld_p);
                let hitType = rand_type < gb_p ? "GB" : (rand_type < gb_p + fb_p ? "FB" : "LD");
                
                let baseHitChance = hitType === "GB" ? 0.32 : (hitType === "FB" ? 0.28 : 0.76);
                let h9Effect = (55 - curPitcherHome.h9) * 0.0012; 
                let finalHitChance = Math.max(0.18, Math.min(0.92, baseHitChance + h9Effect));

                if(Math.random() < finalHitChance) {
                    let hr9Reduction = (curPitcherHome.hr9 / 100) * 0.4; 
                    let finalBarrel = (b.barrel / 100) * (1 - hr9Reduction);
                    
                    let kind = "1B";
                    if ((hitType === "FB" || hitType === "LD") && Math.random() < finalBarrel) {
                        kind = "HR"; b.stats.hr++;
                    } else {
                        let extraBaseChance = 0.15 + (b.isop * 0.003);
                        kind = Math.random() < extraBaseChance ? "2B" : "1B";
                    }
                    b.stats.hits++;
                    let runs = advanceRunners(bases, kind);
                    awayScore += runs; curPitcherHome.stats.er += runs; curPitcherHomeErInMatch += runs; b.stats.rbi += runs;
                } else { 
                    outs++; curPitcherHome.stats.ipOuts++; currentInningOutsHome++; 
                }
            }
            awayOrder = (awayOrder + 1) % (currentBatters.length || 9);
        }

        // 裏の攻撃 (HOME攻撃 vs AWAYの投手陣)
        outs = 0; bases = [false, false, false];
        while (outs < 3) {
            let needChange = false;

            // 【新ロジック】9回裏、AWAYチームが1〜3点リード、または同点なら守護神を投入
            if (inning === 9 && curPitcherAway.role !== "守護神") {
                let scoreDiff = awayScore - homeScore;
                if (scoreDiff >= 0 && scoreDiff <= 3) {
                    let closer = away.pitchers.find(p => p.role === "守護神" && p.staCurrent >= 10);
                    if (closer) {
                        curPitcherAway = closer;
                        needChange = false;
                        if (!appearedAway.includes(curPitcherAway.name)) {
                            curPitcherAway.stats.appearances++;
                            appearedAway.push(curPitcherAway.name);
                            potentialSaverAway = curPitcherAway; // セーブ機会の記録
                        }
                        pitchCountAway = 0; curPitcherAwayErInMatch = 0; currentInningOutsAway = 0;
                    }
                }
            }

            if (curPitcherAway.role !== "守護神") {
                if (inning <= 5) {
                    if (pitchCountAway >= curPitcherAway.staMax || curPitcherAwayErInMatch >= 6) needChange = true;
                } else {
                    if (curPitcherAway.role === "先発") {
                        if (pitchCountAway >= curPitcherAway.staMax || curPitcherAwayErInMatch >= 4) needChange = true;
                    } else {
                        if (currentInningOutsAway >= 3 || curPitcherAwayErInMatch >= 3 || pitchCountAway >= curPitcherAway.staMax) needChange = true;
                    }
                }
            } else {
                if (curPitcherAwayErInMatch >= 3) needChange = true;
            }

            if (needChange) {
                let availableReliefs = away.pitchers.filter(p => p.role === "リリーフ" && p.staCurrent > 15);
                if (availableReliefs.length > 0) {
                    availableReliefs.sort((a, b) => a.stats.appearances - b.stats.appearances);
                    curPitcherAway = availableReliefs[0];
                    if (!appearedAway.includes(curPitcherAway.name)) {
                        curPitcherAway.stats.appearances++;
                        appearedAway.push(curPitcherAway.name);
                    }
                    pitchCountAway = 0; curPitcherAwayErInMatch = 0; currentInningOutsAway = 0;
                }
            }
            
            let currentBattersHome = home.batters.filter(bat => bat.role !== "控え" && bat.role.includes("番"));
            let b = currentBattersHome[homeOrder];
            
            if(!b) {
                outs++; curPitcherAway.stats.ipOuts++; currentInningOutsAway++;
                homeOrder = (homeOrder + 1) % (currentBattersHome.length || 9);
                continue;
            }

            b.stats.ab++; pitchCountAway += 4;
            let bbP = (b.bb/100) + ((100 - curPitcherAway.bb9)*0.0006);
            let soP = (b.so/100) + (curPitcherAway.k9*0.001);
            let rand = Math.random();
            
            if(rand < bbP) {
                b.stats.bb++; curPitcherAway.stats.bb++;
                let runs = advanceRunners(bases, "BB");
                homeScore += runs; curPitcherAway.stats.er += runs; curPitcherAwayErInMatch += runs; b.stats.rbi += runs;
            } else if(rand < bbP + soP) {
                outs++; b.stats.so++; curPitcherAway.stats.so++;
                curPitcherAway.stats.ipOuts++; currentInningOutsAway++; 
            } else {
                const gb_p = parseFloat(document.getElementById('hit_gb').value);
                const fb_p = parseFloat(document.getElementById('hit_fb').value);
                const ld_p = parseFloat(document.getElementById('hit_ld').value);
                let rand_type = Math.random() * (gb_p + fb_p + ld_p);
                let hitType = rand_type < gb_p ? "GB" : (rand_type < gb_p + fb_p ? "FB" : "LD");
                
                let baseHitChance = hitType === "GB" ? 0.32 : (hitType === "FB" ? 0.28 : 0.76);
                let h9Effect = (55 - curPitcherAway.h9) * 0.0015;
                let finalHitChance = Math.max(0.18, Math.min(0.92, baseHitChance + h9Effect));

                if(Math.random() < finalHitChance) {
                    let hr9Reduction = (curPitcherAway.hr9 / 100) * 0.4;
                    let finalBarrel = (b.barrel / 100) * (1 - hr9Reduction);
                    
                    let kind = "1B";
                    if ((hitType === "FB" || hitType === "LD") && Math.random() < finalBarrel) {
                        kind = "HR"; b.stats.hr++;
                    } else {
                        let extraBaseChance = 0.15 + (b.isop * 0.003);
                        kind = Math.random() < extraBaseChance ? "2B" : "1B";
                    }
                    b.stats.hits++;
                    let runs = advanceRunners(bases, kind);
                    homeScore += runs; curPitcherAway.stats.er += runs; curPitcherAwayErInMatch += runs; b.stats.rbi += runs;
                } else { 
                    outs++; curPitcherAway.stats.ipOuts++; currentInningOutsAway++; 
                }
            }
            homeOrder = (homeOrder + 1) % (currentBattersHome.length || 9);
        }
    }

    // 勝敗・セーブ（SV）付与判定
    if(awayScore > homeScore) { 
        away.wins++; home.losses++; pAway.stats.wins++; pHome.stats.losses++; 
        // AWAY勝利時に、セーブ判定を満たしたAWAY守護神にSV付与
        if(potentialSaverAway && awayScore - homeScore <= 3) {
            potentialSaverAway.stats.saves++;
        }
    } else if(homeScore > awayScore) { 
        home.wins++; away.losses++; pHome.stats.wins++; pAway.stats.losses++; 
        if(potentialSaverHome && homeScore - awayScore <= 3) {
            potentialSaverHome.stats.saves++;
        }
    } else { 
        away.draws++; home.draws++; 
    }

    // 登板した投手のスタミナ消費
    away.pitchers.forEach(p => { 
        if (p.name === pAway.name) p.staCurrent = 0; 
        else if (appearedAway.includes(p.name)) p.staCurrent = Math.max(0, p.staCurrent - 12);
    });
    home.pitchers.forEach(p => { 
        if (p.name === pHome.name) p.staCurrent = 0; 
        else if (appearedHome.includes(p.name)) p.staCurrent = Math.max(0, p.staCurrent - 12);
    });

    // 防御率（ERA）一括更新
    teams.forEach(t => {
        t.pitchers.forEach(p => {
            if(p.stats.ipOuts > 0) {
                p.stats.era = (p.stats.er * 9) / (p.stats.ipOuts / 3);
            }
        });
    });

    away.rotationIdx++; home.rotationIdx++;
    return `${away.name} ${awayScore} - ${homeScore} ${home.name}`;
}

function formatInningsPitched(totalOuts) {
    let innings = Math.floor(totalOuts / 3);
    let remainingOuts = totalOuts % 3;
    return remainingOuts === 0 ? `${innings}` : `${innings}.${remainingOuts}`;
}

function advanceRunners(bases, hitKind) {
    let runs = 0;
    if (hitKind === "BB") {
        if (bases[0] && bases[1] && bases[2]) runs++;
        else if (bases[0] && bases[1]) bases[2] = true;
        else if (bases[0]) bases[1] = true;
        bases[0] = true;
    } else if (hitKind === "1B") {
        if (bases[2]) { runs++; bases[2] = false; }
        if (bases[1]) { runs++; bases[1] = false; }
        if (bases[0]) bases[1] = true;
        bases[0] = true;
    } else if (hitKind === "2B") {
        if (bases[2]) { runs++; bases[2] = false; }
        if (bases[1]) { runs++; bases[1] = false; }
        if (bases[0]) { bases[2] = true; bases[0] = false; }
        bases[1] = true;
    } else if (hitKind === "HR") {
        runs += 1 + (bases[0]?1:0) + (bases[1]?1:0) + (bases[2]?1:0);
        bases.fill(false);
    }
    return runs;
}

function playNextRound() {
    let res = simulateRound();
    if(!res) return;
    let body = document.getElementById("quick_match_results");
    body.innerHTML = res.map(r => `<tr><td><b>${r}</b></td></tr>`).join("");
    updateUIAll();
}

function playOneWeek() {
    let lastRes = null;
    for(let i=0; i<6; i++) {
        let res = simulateRound();
        if(res) lastRes = res;
    }
    if(lastRes) {
        let body = document.getElementById("quick_match_results");
        body.innerHTML = "<tr><td style='color:green;'><b>一週間分(6カード)を一括消化しました</b></td></tr>" + lastRes.map(r => `<tr><td>${r}</td></tr>`).join("");
    }
    updateUIAll();
}

function playAllSeason() {
    while(totalGamesPlayed < MAX_GAMES) { simulateRound(); }
    let body = document.getElementById("quick_match_results");
    body.innerHTML = "<tr><td style='color:orange; font-weight:bold;'>143試合全日程終了しました！</td></tr>";
    updateUIAll();
}

function resetSeason() {
    totalGamesPlayed = 0;
    initializeLeagueData();
    document.getElementById("quick_match_results").innerHTML = "<tr><td>シーズンをリセットしました。</td></tr>";
    onEditorTeamChange();
    updateUIAll();
}

function onEditorTeamChange() {
    let teamIdx = parseInt(document.getElementById("edit_team_select").value);
    let team = teams[teamIdx];
    let playerSelect = document.getElementById("edit_player_select");
    playerSelect.innerHTML = "";

    team.batters.forEach((p, idx) => {
        playerSelect.innerHTML += `<option value="bat_${idx}">[野手] ${p.role} - ${p.name}</option>`;
    });
    team.pitchers.forEach((p, idx) => {
        playerSelect.innerHTML += `<option value="pit_${idx}">[投手] ${p.role} - ${p.name}</option>`;
    });
    playerSelect.selectedIndex = 0;
    onEditorPlayerChange();
}

function onEditorPlayerChange() {
    let teamIdx = parseInt(document.getElementById("edit_team_select").value);
    let playerVal = document.getElementById("edit_player_select").value;
    if(!playerVal) return;
    
    let type = playerVal.split("_")[0];
    let idx = parseInt(playerVal.split("_")[1]);
    let player = type === "bat" ? teams[teamIdx].batters[idx] : teams[teamIdx].pitchers[idx];

    document.getElementById("form_name").value = player.name;
    document.getElementById("form_role").value = player.role;
    document.getElementById("form_pos").value = player.currentPos;

    if(type === "bat") {
        document.getElementById("form_bat_stats").style.display = "block";
        document.getElementById("form_pit_stats").style.display = "none";
        document.getElementById("form_bb").value = player.bb;
        document.getElementById("form_so").value = player.so;
        document.getElementById("form_barrel").value = player.barrel;
        document.getElementById("form_isop").value = player.isop;
        document.getElementById("form_uzr").value = player.uzr;
        document.getElementById("form_err").value = player.err;
    } else {
        document.getElementById("form_bat_stats").style.display = "none";
        document.getElementById("form_pit_stats").style.display = "block";
        document.getElementById("form_h9").value = player.h9;
        document.getElementById("form_k9").value = player.k9;
        document.getElementById("form_bb9").value = player.bb9;
        document.getElementById("form_hr9").value = player.hr9;
        document.getElementById("form_sta").value = player.staMax;
    }
}

function saveEditorData() {
    let teamIdx = parseInt(document.getElementById("edit_team_select").value);
    let playerVal = document.getElementById("edit_player_select").value;
    let type = playerVal.split("_")[0];
    let idx = parseInt(playerVal.split("_")[1]);
    let team = teams[teamIdx];
    
    if(type === "bat") {
        let p = team.batters[idx];
        p.name = document.getElementById("form_name").value;
        p.role = document.getElementById("form_role").value;
        p.currentPos = document.getElementById("form_pos").value;
        p.bb = parseFloat(document.getElementById("form_bb").value);
        p.so = parseFloat(document.getElementById("form_so").value);
        p.barrel = parseFloat(document.getElementById("form_barrel").value);
        p.isop = parseFloat(document.getElementById("form_isop").value);
        p.uzr = parseFloat(document.getElementById("form_uzr").value);
        p.err = parseFloat(document.getElementById("form_err").value);
    } else {
        let p = team.pitchers[idx];
        p.name = document.getElementById("form_name").value;
        p.role = document.getElementById("form_role").value;
        p.currentPos = document.getElementById("form_pos").value;
        p.h9 = parseFloat(document.getElementById("form_h9").value);
        p.k9 = parseFloat(document.getElementById("form_k9").value);
        p.bb9 = parseFloat(document.getElementById("form_bb9").value);
        p.hr9 = parseFloat(document.getElementById("form_hr9").value);
        p.staMax = parseFloat(document.getElementById("form_sta").value);
    }
    
    let currentPositions = team.batters.map(b => b.currentPos);
    let uniqLen = [...new Set(currentPositions)].length;
    document.getElementById("editor_dup_warning").style.display = (uniqLen < 8) ? "block" : "none";

    let savedIndex = document.getElementById("edit_player_select").selectedIndex;
    onEditorTeamChange();
    document.getElementById("edit_player_select").selectedIndex = savedIndex;
    updateUIAll();
}

function updateUIAll() {
    document.getElementById("current_game_count").innerText = totalGamesPlayed;
    document.getElementById("current_week_count").innerText = Math.floor(totalGamesPlayed / 6) + 1;
    
    let sorted = [...teams].sort((a,b) => {
        let wpA = a.wins / ((a.wins + a.losses) || 1);
        let wpB = b.wins / ((b.wins + b.losses) || 1);
        return wpB - wpA;
    });
    let sBody = document.getElementById("standings_body");
    sBody.innerHTML = "";
    sorted.forEach((t, i) => {
        let wp = t.wins / ((t.wins + t.losses) || 1);
        sBody.innerHTML += `<tr><td>${i+1}</td><td><b>${t.name}</b></td><td>${t.wins}</td><td>${t.losses}</td><td>${t.draws}</td><td>${wp.toFixed(3)}</td><td>-</td></tr>`;
    });

    let bList = [];
    teams.forEach(t => t.batters.forEach(b => bList.push({tName: t.name, data: b})));
    bList.sort((a,b) => (b.data.stats.hits / (b.data.stats.ab || 1)) - (a.data.stats.hits / (a.data.stats.ab || 1)));
    
    let batBody = document.querySelector("#batting_stats_table tbody");
    batBody.innerHTML = "";
    bList.slice(0, 15).forEach(item => {
        let b = item.data;
        let avg = b.stats.hits / (b.stats.ab || 1);
        batBody.innerHTML += `<tr><td>${item.tName}</td><td><b>${b.name}</b></td><td>${b.currentPos}</td><td>${avg.toFixed(3)}</td><td>${b.stats.games}</td><td>${b.stats.ab}</td><td>${b.stats.hits}</td><td>${b.stats.hr}</td><td>${b.stats.rbi}</td><td>${b.stats.bb}</td></tr>`;
    });

    let pList = [];
    teams.forEach(t => t.pitchers.forEach(p => pList.push({tName: t.name, data: p})));
    pList.sort((a,b) => {
        if(a.data.stats.ipOuts === 0) return 1;
        if(b.data.stats.ipOuts === 0) return -1;
        return a.data.stats.era - b.data.stats.era;
    });
    
    let pitBody = document.querySelector("#pitching_stats_table tbody");
    pitBody.innerHTML = "";
    pList.forEach(item => {
        let p = item.data;
        pitBody.innerHTML += `<tr><td>${item.tName}</td><td><b>${p.name}</b></td><td>${p.role}</td><td><b>${p.stats.ipOuts > 0 ? p.stats.era.toFixed(2) : '-.--'}</b></td><td>${p.stats.appearances}</td><td>${p.stats.wins}</td><td>${p.stats.losses}</td><td><b>${p.stats.saves}</b></td><td>${formatInningsPitched(p.stats.ipOuts)}</td><td>${p.stats.so}</td><td>${p.staCurrent}</td></tr>`;
    });
}

function switchTab(tabId, el) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    el.classList.add('active');
}

initializeLeagueData();
onEditorTeamChange();
updateUIAll();
</script>
