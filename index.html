<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - 完走検証版</title>
    <script src="names.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    </style>
</head>
<body>
    <h1>進行度: <span id="status">0 / 143</span></h1>
    <button onclick="runGames(143)">シーズン全進行</button>
    <button onclick="resetSeason()">リセット</button>

    <table id="standings_table">
        <thead><tr><th>チーム</th><th>勝</th><th>敗</th><th>分</th></tr></thead>
        <tbody id="standings_body"></tbody>
    </table>

    <script>
        const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];
        let totalGamesPlayed = 0;
        let teams = [];
        let schedule = [];

        function initSeason() {
            // 1. チーム初期化
            teams = teamNames.map(name => ({
                name, wins: 0, losses: 0, draws: 0,
                batters: Array.from({length: 9}, () => ({ name: generateRandomPlayerName(), stats: { ab: 0, hits: 0 } })),
                pitchers: Array.from({length: 6}, () => ({ name: generateRandomPlayerName(), stats: { ipOuts: 0, er: 0 } }))
            }));

            // 2. 143試合分のスケジュールを確定生成
            schedule = [];
            for(let i = 0; i < 143; i++) {
                let t1 = i % 6;
                let t2 = (i + 1 + Math.floor(i/6)) % 6;
                schedule.push([t1, t2]);
            }
            totalGamesPlayed = 0;
        }

        function resetSeason() {
            initSeason();
            updateUI();
        }

        function runGames(count) {
            // 現在の試合数からターゲットまで回す
            let end = Math.min(totalGamesPlayed + count, 143);
            while (totalGamesPlayed < end) {
                let pair = schedule[totalGamesPlayed];
                let away = teams[pair[0]];
                let home = teams[pair[1]];

                // 簡易シミュレーション
                let scoreA = Math.floor(Math.random() * 5);
                let scoreH = Math.floor(Math.random() * 5);
                if (scoreA > scoreH) { away.wins++; home.losses++; }
                else if (scoreH > scoreA) { home.wins++; away.losses++; }
                else { away.draws++; home.draws++; }
                
                totalGamesPlayed++;
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById("status").innerText = totalGamesPlayed + " / 143";
            document.getElementById("standings_body").innerHTML = teams.map(t => 
                `<tr><td>${t.name}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.draws}</td></tr>`
            ).join("");
        }

        // 初期実行
        initSeason();
        updateUI();
    </script>
</body>
</html>
