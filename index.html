<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - リーグ完全シミュレーター</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; }
        .controls { margin-bottom: 20px; padding: 15px; border-bottom: 2px solid #eee; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #2d3748; color: white; padding: 8px; font-size: 0.8em; }
        td { padding: 6px; border: 1px solid #ddd; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h1>全自動シーズンシミュレーター</h1>
    <div class="controls">
        <button onclick="runGames(1)">1試合進行</button>
        <button onclick="runGames(6)">一週間(6試合)進行</button>
        <button onclick="runGames(143)">シーズン全進行</button>
    </div>

    <div id="status">進行度: 0 / 143</div>
    
    <h2>野手リーダーボード</h2>
    <table id="bat_table">
        <thead><tr><th>チーム</th><th>名前</th><th>打率</th><th>安打</th><th>打数</th><th>HR</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script>
const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];
let totalGamesPlayed = 0;
let teams = teamNames.map(name => ({
    name,
    batters: Array.from({length: 9}, (_, i) => ({ name: "打者"+(i+1), stats: { ab: 0, hits: 0, hr: 0 } })),
    pitchers: Array.from({length: 6}, (_, i) => ({ name: "投手"+(i+1), stats: { ipOuts: 0, er: 0, so: 0 } }))
}));

// 1打席の結果計算
function simulateAtBat(batter, pitcher) {
    batter.stats.ab++; // 【修正】ここで確実に打数をカウント
    let roll = Math.random() * 100;
    if (roll < 10) return "BB";
    if (roll < 30) return "SO";
    if (roll < 40) { batter.stats.hr++; return "HR"; }
    if (roll < 70) { batter.stats.hits++; return "1B"; }
    return "OUT";
}

function simulateMatch(away, home) {
    for (let i = 0; i < 9; i++) { // 9回表裏
        [ {t: away, p: home.pitchers[0]}, {t: home, p: away.pitchers[0]} ].forEach(half => {
            let outs = 0;
            while (outs < 3) {
                let res = simulateAtBat(half.t.batters[Math.floor(Math.random()*9)], half.p);
                if (res === "SO") outs++;
                else if (res === "OUT") outs++;
                half.p.stats.ipOuts++;
            }
        });
    }
}

function runGames(count) {
    for(let i = 0; i < count; i++) {
        if(totalGamesPlayed >= 143) break;
        // 簡易リーグ戦ペアリング
        simulateMatch(teams[totalGamesPlayed % 6], teams[(totalGamesPlayed + 1) % 6]);
        totalGamesPlayed++;
    }
    updateUI();
}

function updateUI() {
    document.getElementById("status").innerText = `進行度: ${totalGamesPlayed} / 143`;
    let tbody = document.querySelector("#bat_table tbody");
    tbody.innerHTML = teams.flatMap(t => t.batters.map(b => ({tName: t.name, b}))).map(item => 
        `<tr><td>${item.tName}</td><td>${item.b.name}</td><td>${(item.b.stats.hits / Math.max(item.b.stats.ab, 1)).toFixed(3)}</td><td>${item.b.stats.hits}</td><td>${item.b.stats.ab}</td><td>${item.b.stats.hr}</td></tr>`
    ).join("");
}
</script>
</body>
</html>
