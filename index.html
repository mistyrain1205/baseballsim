<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - 疲労・継投管理版</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #2d3748; color: white; padding: 8px; font-size: 0.8em; }
        td { padding: 6px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 0.9em; }
    </style>
</head>
<body>
<div class="container">
    <h1>進行度: <span id="current_game_count">0</span> / 143</h1>
    <button onclick="playMatch()">1試合進行</button>

    <div class="grid">
        <div>
            <h2>野手成績</h2>
            <table id="batting_table"><thead><tr><th>名前</th><th>打率</th><th>WAR</th></tr></thead><tbody></tbody></table>
        </div>
        <div>
            <h2>投手成績 (疲労管理)</h2>
            <table id="pitching_table"><thead><tr><th>名前</th><th>役割</th><th>疲労</th><th>防御率</th><th>WAR</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
</div>

<script>
const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];
let totalGamesPlayed = 0;

let teams = teamNames.map(name => ({
    name, rotationIdx: 0,
    batters: Array.from({length: 9}, (_, i) => ({ name: "打者"+(i+1), stats: { ab: 0, hits: 0 } })),
    pitchers: Array.from({length: 6}, (_, i) => ({ 
        name: "投手"+(i+1), role: i===0?"先発":(i===5?"守護神":"リリーフ"), 
        fatigue: 0, stats: { ipOuts: 0, so: 0, er: 0 } 
    }))
}));

function playMatch() {
    if (totalGamesPlayed >= 143) return;

    teams.forEach(t => {
        // 野手
        t.batters.forEach(b => { b.stats.ab++; if(Math.random() > 0.7) b.stats.hits++; });

        // 投手ローテ
        let starters = t.pitchers.filter(p => p.role === "先発");
        let starter = starters[t.rotationIdx % starters.length];
        
        // 登板と疲労
        if (starter.fatigue > 50) {
            // 疲労時は交代：リリーフから疲労が少ない者を選ぶ
            let relief = t.pitchers.filter(p => p.role !== "先発").sort((a,b) => a.fatigue - b.fatigue)[0];
            relief.stats.ipOuts += 9;
            relief.fatigue += 20;
        } else {
            starter.stats.ipOuts += 18;
            starter.fatigue += 40; // 先発はスタミナ消費大
        }
        
        // 疲労回復 (試合ごとに少し回復)
        t.pitchers.forEach(p => p.fatigue = Math.max(0, p.fatigue - 10));
        
        t.rotationIdx++;
    });
    totalGamesPlayed++;
    updateUI();
}

function updateUI() {
    document.getElementById("current_game_count").innerText = totalGamesPlayed;
    document.querySelector("#batting_table tbody").innerHTML = teams.flatMap(t => t.batters).map(b => 
        `<tr><td>${b.name}</td><td>${(b.stats.hits/(b.stats.ab||1)).toFixed(3)}</td><td>${(b.stats.hits*0.05).toFixed(1)}</td></tr>`
    ).join("");

    document.querySelector("#pitching_table tbody").innerHTML = teams.flatMap(t => t.pitchers).map(p => 
        `<tr><td>${p.name}</td><td>${p.role}</td><td>${p.fatigue}</td><td>${(p.stats.er*9/(Math.max(p.stats.ipOuts/3,1))).toFixed(2)}</td><td>${(p.stats.ipOuts/15 + p.stats.so*0.1).toFixed(1)}</td></tr>`
    ).join("");
}
updateUI();
</script>
</body>
</html>
