<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - 統合完全版</title>
    <script src="names.js"></script>
    <style>
        /* UIデザイン: 情報を整理して見やすく配置するためのスタイル定義 */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 20px; background: #f4f7f6; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .settings { background: #edf2f7; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #2d3748; color: white; padding: 12px; }
        td { padding: 10px; border: 1px solid #e2e8f0; text-align: center; }
    </style>
</head>
<body>
<div class="container" id="main_game_container">
    <h1>Baseball Tycoon: シーズン進行状況 <span id="status">0 / 429</span></h1>
    
    <div class="settings">
        <div>ヒット率: <input type="number" id="rateHit" value="0.280" step="0.005"></div>
        <div>HR率: <input type="number" id="rateHr" value="0.035" step="0.005"></div>
        <div>三振率: <input type="number" id="rateSo" value="0.300" step="0.005"></div>
    </div>

    <div class="controls">
        <button onclick="runGames(1)">1試合進行</button>
        <button onclick="runGames(429)">全試合一括進行</button>
        <button onclick="resetSeason()" style="background:#e53e3e; color:white;">リセット</button>
    </div>

    <h2>リーグ順位表</h2>
    <table id="standings_table">
        <thead><tr><th>順位</th><th>チーム</th><th>勝</th><th>敗</th><th>分</th><th>消化試合</th><th>勝率</th></tr></thead>
        <tbody id="standings_body"></tbody>
    </table>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div><h2>野手リーダー</h2><table id="bat_table"><thead><tr><th>名前</th><th>打率</th><th>HR</th></tr></thead><tbody></tbody></table></div>
        <div><h2>投手リーダー</h2><table id="pit_table"><thead><tr><th>名前</th><th>防御率</th><th>回</th><th>奪三振</th></tr></thead><tbody></tbody></table></div>
    </div>
</div>

<div id="offseason_container" style="display: none;">
    </div>

<script>
/**
 * シーズン初期化関数
 * 各チームに6名の投手を配置し、ローテーション管理用の index を持たせます。
 */
function initSeason() {
    teams = teamNames.map(name => ({
        name, wins: 0, losses: 0, draws: 0,
        pitcherIndex: 0, // 誰が先発するかを管理する重要変数
        batters: Array.from({length: 9}, () => ({ name: generateRandomPlayerName(), stats: { ab: 0, hits: 0, hr: 0 } })),
        pitchers: Array.from({length: 6}, () => ({ name: generateRandomPlayerName(), stats: { ipOuts: 0, er: 0, so: 0 } }))
    }));
    // ...以降のスケジュール生成ロジック...
}

/**
 * 試合シミュレート関数
 * 9イニング分の攻撃を処理し、終了後に投手インデックスをインクリメントします。
 */
function simulateMatch(away, home) {
    let awayPitcher = away.pitchers[away.pitcherIndex];
    let homePitcher = home.pitchers[home.pitcherIndex];
    // ...イニングループ処理...
    away.pitcherIndex = (away.pitcherIndex + 1) % 6; // 次の登板へ
    home.pitcherIndex = (home.pitcherIndex + 1) % 6;
}
</script>
<script src="draft.js"></script> </body>
</html>
