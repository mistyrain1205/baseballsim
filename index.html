<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本格派・野球試合シミュレーター (選手個別守備設定版)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1050px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1a4a75;
            margin-bottom: 20px;
        }
        /* スコアボード */
        .scoreboard {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            background: #1a202c;
            color: white;
            border-radius: 8px;
            overflow: hidden;
        }
        .scoreboard th, .scoreboard td {
            border: 1px solid #4a5568;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        .scoreboard th { background: #2d3748; color: #a0aec0; }
        .scoreboard td.runs { color: #ecc94b; font-size: 1.2em; }

        /* 試合中継ステータス表示 */
        .game-status-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: #fffaf0;
            border: 2px solid #feebc8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }
        .status-item { font-size: 1.1em; align-self: center; }
        .diamond { color: #4a5568; font-size: 1.2em; letter-spacing: 2px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }
        .card h2 {
            margin-top: 0;
            color: #2c5282;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
            font-size: 1.2em;
        }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 3px; font-size: 0.85em; }
        input[type="number"], select {
            width: 100%; padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box;
        }
        
        /* 選手個別設定用の簡易テーブル */
        .player-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
            margin-top: 10px;
        }
        .player-table th, .player-table td {
            padding: 4px 6px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .player-table th { background: #edf2f7; color: #4a5568; }
        .player-table input { width: 55px; padding: 3px; text-align: center; border: 1px solid #cbd5e0; border-radius: 3px; }

        /* タブ切り替え */
        .tabs { display: flex; margin-bottom: -1px; }
        .tab {
            padding: 8px 16px; border: 1px solid #e2e8f0; background: #edf2f7;
            cursor: pointer; border-radius: 6px 6px 0 0; font-weight: bold; font-size: 0.9em; margin-right: 4px;
        }
        .tab.active { background: #f8fafc; border-bottom: 1px solid #f8fafc; color: #2c5282; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .btn-play {
            display: block; width: 100%; padding: 15px; background: #2b6cb0; color: white;
            border: none; border-radius: 6px; font-size: 1.3em; cursor: pointer; font-weight: bold;
            transition: background 0.2s; margin-bottom: 15px;
        }
        .btn-play:hover { background: #2c5282; }
        .btn-reset {
            display: block; width: 100%; padding: 8px; background: #e53e3e; color: white;
            border: none; border-radius: 6px; font-size: 0.9em; cursor: pointer; font-weight: bold;
            margin-bottom: 25px;
        }

        .result-box {
            margin-top: 25px; padding: 25px; background: #f7fafc; border: 2px solid #cbd5e0; border-radius: 8px;
        }
        .log {
            background: #1a202c; color: #fff; padding: 20px; border-radius: 6px;
            font-family: monospace; font-size: 1.1em; line-height: 1.6; margin-top: 15px;
            white-space: pre-wrap; max-height: 400px; overflow-y: auto;
        }
        .hit-badge { background: #e53e3e; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .barrel-badge { background: #d69e2e; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .error-badge { background: #b7791f; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .out-badge { background: #4a5568; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>本格派・野球試合シミュレーター (個別守備能力反映版)</h1>

    <table class="scoreboard">
        <thead>
            <tr>
                <th style="width: 150px;">チーム</th>
                <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th>
                <th style="width: 60px; background: #2d3748;">R</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>AWAY (先攻)</td>
                <td id="a1">-</td><td id="a2">-</td><td id="a3">-</td><td id="a4">-</td><td id="a5">-</td><td id="a6">-</td><td id="a7">-</td><td id="a8">-</td><td id="a9">-</td>
                <td id="away_runs" class="runs">0</td>
            </tr>
            <tr>
                <td>HOME (後攻)</td>
                <td id="h1">-</td><td id="h2">-</td><td id="h3">-</td><td id="h4">-</td><td id="h5">-</td><td id="h6">-</td><td id="h7">-</td><td id="h8">-</td><td id="h9">-</td>
                <td id="home_runs" class="runs">0</td>
            </tr>
        </tbody>
    </table>

    <div class="game-status-box">
        <div class="status-item" id="current_inning_text">試合前</div>
        <div class="status-item" id="outs_text">0 アウト</div>
        <div class="status-item" id="pitcher_status_text">投手: -</div>
        <div class="status-item diamond" id="runners_text">◇ ◇ ◇</div>
    </div>
    <div style="text-align: center; margin-bottom: 15px; font-weight: bold; color: #2c5282;" id="batter_status_text"></div>

    <button class="btn-play" id="play_btn" onclick="playNextBatter()">プレイ開始</button>
    <button class="btn-reset" onclick="resetGame()">試合をリセット</button>

    <div class="grid">
        <!-- 左側：チームの基本方針や打撃の共通設定 -->
        <div class="card">
            <h2>チーム共通・打撃基準設定</h2>
            <div class="form-group"><label>基準四死球率 (%)</label><input type="number" id="base_bb" value="8.0" step="0.1"></div>
            <div class="form-group"><label>基準三振率 (%)</label><input type="number" id="base_so" value="18.0" step="0.1"></div>
            <div class="form-group"><label>バレル率 (Barrel%)</label><input type="number" id="base_barrel" value="10.0" step="0.1"></div>
            <div class="form-group"><label>ゴロ (GB) %</label><input type="number" id="hit_gb" value="45"></div>
            <div class="form-group"><label>フライ (FB) %</label><input type="number" id="hit_fb" value="35"></div>
            <div class="form-group"><label>ライナー (LD) %</label><input type="number" id="hit_ld" value="20"></div>
            <div style="margin-top: 15px;">
                <div class="form-group"><label>先発 100球超の四死球率増加係数</label><input type="number" id="p_fatigue" value="0.05" step="0.01"></div>
                <div class="form-group"><label>リリーフ 四死球率補正値 (優秀=0.9)</label><input type="number" id="reliefe_factor" value="0.9" step="0.1"></div>
            </div>
        </div>

        <!-- 右側：個別野手・守備能力エディタ（タブ切り替え） -->
        <div class="card" style="display: flex; flex-direction: column;">
            <h2>守備陣・個別パラメータ設定</h2>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('away-def-tab', this)">AWAY守備</div>
                <div class="tab" onclick="switchTab('home-def-tab', this)">HOME守備</div>
            </div>
            
            <div id="away-def-tab" class="tab-content active">
                <table class="player-table">
                    <thead>
                        <tr><th>打順</th><th>守備位置</th><th>UZR</th><th>エラー率(%)</th></tr>
                    </thead>
                    <tbody id="away-roster-rows"></tbody>
                </table>
            </div>

            <div id="home-def-tab" class="tab-content">
                <table class="player-table">
                    <thead>
                        <tr><th>打順</th><th>守備位置</th><th>UZR</th><th>エラー率(%)</th></tr>
                    </thead>
                    <tbody id="home-roster-rows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="result-box" id="resultArea" style="display:none;">
        <div class="result-title" id="log_title" style="font-weight: bold; color: #1a4a75;">実況ログ</div>
        <div class="log" id="simLog"></div>
    </div>
</div>

<script>
// ポジション定義（分かりやすさのため打順＝固定の守備位置とします）
const positions = ["捕手", "一塁手", "二塁手", "三塁手", "遊撃手", "左翼手", "中堅手", "右翼手", "投手(野手扱い)"];

// デフォルトの個別守備能力（野球のセオリーに合わせて初期値を少しリアルに調整）
// 遊撃手や中堅手はUZRが高め、ファーストは低め、エラー率は内野が高め等
const defaultAwayDefense = [
    { pos: "捕手", uzr: 0.0, err: 1.5 },
    { pos: "一塁手", uzr: -1.0, err: 2.0 },
    { pos: "二塁手", uzr: 2.0, err: 2.5 },
    { pos: "三塁手", uzr: 1.0, err: 3.0 },
    { pos: "遊撃手", uzr: 3.5, err: 3.5 },
    { pos: "左翼手", uzr: 0.5, err: 1.5 },
    { pos: "中堅手", uzr: 4.0, err: 1.2 },
    { pos: "右翼手", uzr: 1.5, err: 1.8 },
    { pos: "投手",   uzr: 0.0, err: 2.0 }
];

const defaultHomeDefense = [
    { pos: "捕手", uzr: 0.5, err: 1.2 },
    { pos: "一塁手", uzr: -0.5, err: 1.8 },
    { pos: "二塁手", uzr: 1.5, err: 2.2 },
    { pos: "三塁手", uzr: 2.0, err: 2.8 },
    { pos: "遊撃手", uzr: 4.0, err: 3.2 },
    { pos: "左翼手", uzr: -1.0, err: 2.0 },
    { pos: "中堅手", uzr: 3.0, err: 1.5 },
    { pos: "右翼手", uzr: 2.0, err: 1.5 },
    { pos: "投手",   uzr: 0.0, err: 2.0 }
];

// 画面にエディタ用の行を生成
function generateRosterRows() {
    const awayContainer = document.getElementById("away-roster-rows");
    const homeContainer = document.getElementById("home-roster-rows");
    
    awayContainer.innerHTML = "";
    homeContainer.innerHTML = "";

    for(let i=0; i<9; i++) {
        // AWAY
        awayContainer.innerHTML += `
            <tr>
                <td>${i+1}</td>
                <td><b>${positions[i]}</b></td>
                <td><input type="number" id="away_uzr_${i}" value="${defaultAwayDefense[i].uzr}" step="0.5"></td>
                <td><input type="number" id="away_err_${i}" value="${defaultAwayDefense[i].err}" step="0.1"></td>
            </tr>`;
        // HOME
        homeContainer.innerHTML += `
            <tr>
                <td>${i+1}</td>
                <td><b>${positions[i]}</b></td>
                <td><input type="number" id="home_uzr_${i}" value="${defaultHomeDefense[i].uzr}" step="0.5"></td>
                <td><input type="number" id="home_err_${i}" value="${defaultHomeDefense[i].err}" step="0.1"></td>
            </tr>`;
    }
}

// タブ切り替えロジック
function switchTab(tabId, el) {
    const contents = document.querySelectorAll('.tab-content');
    contents.forEach(c => c.classList.remove('active'));
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(t => t.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    el.classList.add('active');
}

// 試合進行用変数
let inning = 1;         
let isTop = true;       
let gameOver = false;
let gameStarted = false;

let awayScore = Array(9).fill(0);
let homeScore = Array(9).fill(0);

let currentInningRuns = 0;
let outs = 0;
let bases = [false, false, false];

let awayOrder = 0;
let homeOrder = 0;

let pitcherState = {
    away: { name: "AWAY先発", balls: 0, runsAllowed: 0, isRelief: false },
    home: { name: "HOME先発", balls: 0, runsAllowed: 0, isRelief: false }
};

function getBatterProfile(orderIdx) {
    const order = orderIdx + 1;
    if (order === 1 || order === 2) return { name: `${order}番(${positions[orderIdx]})`, barrelMod: 0.7, contactMod: 1.1 };
    if (order === 3 || order === 4 || order === 5) return { name: `${order}番(${positions[orderIdx]}) [主砲]`, barrelMod: 1.8, contactMod: 0.9 };
    return { name: `${order}番(${positions[orderIdx]})`, barrelMod: 0.8, contactMod: 1.0 };
}

// 動的に画面の入力値からディフェンスデータを取得する関数
function getDefenseData(team, posIdx) {
    const prefix = team === "AWAY" ? "away" : "home";
    const uzr = parseFloat(document.getElementById(`${prefix}_uzr_${posIdx}`).value) || 0;
    const err = parseFloat(document.getElementById(`${prefix}_err_${posIdx}`).value) || 0;
    return { posName: positions[posIdx], uzr: uzr, err: err / 100 };
}

// 打球の種類から、どのポジションに飛ぶかを確率でマッピング
function getDefenseResponsible(hitType) {
    let rand = Math.random();
    if (hitType === "GB") {
        // ゴロは内野に飛ぶ (投:15%, 捕:5%, 一:15%, 二:25%, 三:15%, 遊:25%)
        if (rand < 0.15) return 8; // 投手
        if (rand < 0.20) return 0; // 捕手
        if (rand < 0.35) return 1; // 一塁手
        if (rand < 0.60) return 2; // 二塁手
        if (rand < 0.75) return 3; // 三塁手
        return 4; // 遊撃手
    } else {
        // フライ・ライナーは外野、または内野のポップフライ
        // (三遊間ライナー/外野フライなど。外野への確率を高めに設定：左:25%, 中:35%, 右:25%, 内野ポップ:15%)
        if (rand < 0.25) return 5; // 左翼手
        if (rand < 0.60) return 6; // 中堅手
        if (rand < 0.85) return 7; // 右翼手
        if (rand < 0.90) return 4; // 遊撃手
        return 3; // 三塁手
    }
}

function resetGame() {
    inning = 1; isTop = true; gameOver = false; gameStarted = false;
    awayScore = Array(9).fill(0); homeScore = Array(9).fill(0);
    currentInningRuns = 0; outs = 0; bases = [false, false, false];
    awayOrder = 0; homeOrder = 0;
    
    pitcherState = {
        away: { name: "AWAY先発", balls: 0, runsAllowed: 0, isRelief: false },
        home: { name: "HOME先発", balls: 0, runsAllowed: 0, isRelief: false }
    };
    
    for(let i=1; i<=9; i++) {
        document.getElementById(`a${i}`).innerText = "-";
        document.getElementById(`h${i}`).innerText = "-";
    }
    document.getElementById("away_runs").innerText = "0";
    document.getElementById("home_runs").innerText = "0";
    document.getElementById("simLog").innerText = "";
    document.getElementById("resultArea").style.display = "none";
    
    updateDisplay();
}

function updateDisplay() {
    if (!gameStarted) {
        document.getElementById("current_inning_text").innerText = "試合前";
        document.getElementById("play_btn").innerText = "試合開始";
        document.getElementById("batter_status_text").innerText = "";
        return;
    }

    const offenseTeam = isTop ? "AWAY" : "HOME";
    const currentPitcher = isTop ? pitcherState.home : pitcherState.away;
    const currentOrderIdx = isTop ? awayOrder : homeOrder;
    const batter = getBatterProfile(currentOrderIdx);

    document.getElementById("current_inning_text").innerText = `${inning}回${isTop ? '表' : '裏'}`;
    document.getElementById("outs_text").innerText = `${outs} アウト`;
    document.getElementById("pitcher_status_text").innerText = `投手: ${currentPitcher.name} (${currentPitcher.balls}球)`;
    
    const b1 = bases[0] ? "◆" : "◇";
    const b2 = bases[1] ? "◆" : "◇";
    const b3 = bases[2] ? "◆" : "◇";
    document.getElementById("runners_text").innerText = `${b3} ${b2} ${b1}`;

    document.getElementById("batter_status_text").innerText = `打者: ${offenseTeam} ${batter.name}`;
    document.getElementById("play_btn").innerText = "1打席シミュレート";
}

function playNextBatter() {
    if (gameOver) return;
    if (!gameStarted) {
        gameStarted = true;
        appendLog(`=== 試合開始 ===\n`);
        document.getElementById("a1").innerText = "0";
        updateDisplay();
        return;
    }

    let offenseTeam = isTop ? "AWAY" : "HOME";
    let defenseTeam = isTop ? "HOME" : "AWAY"; // 守備側チーム
    let currentPitcher = isTop ? pitcherState.home : pitcherState.away;
    let currentOrderIdx = isTop ? awayOrder : homeOrder;
    let batter = getBatterProfile(currentOrderIdx);

    // 継投判定
    let isScoringPosition = bases[1] || bases[2];
    if (!currentPitcher.isRelief && ((currentPitcher.balls >= 100 && isScoringPosition) || currentPitcher.balls >= 105)) {
        appendLog(`\n🚨 【投手交代】${defenseTeam}はリリーフ投手をマウンドに送ります。\n`);
        currentPitcher.name = `${defenseTeam}リリーフ`;
        currentPitcher.balls = 0;
        currentPitcher.isRelief = true;
        currentPitcher.runsAllowed = 0;
    }

    let abBalls = Math.floor(Math.random() * 5) + 2; 
    currentPitcher.balls += abBalls;

    const base_bb = parseFloat(document.getElementById('base_bb').value) / 100;
    const base_so = parseFloat(document.getElementById('base_so').value) / 100;
    const base_barrel = parseFloat(document.getElementById('base_barrel').value) / 100;
    const gb_p = parseFloat(document.getElementById('hit_gb').value);
    const fb_p = parseFloat(document.getElementById('hit_fb').value);
    const ld_p = parseFloat(document.getElementById('hit_ld').value);
    const p_fatigue = parseFloat(document.getElementById('p_fatigue').value) / 100;
    const reliefe_factor = parseFloat(document.getElementById('reliefe_factor').value);

    let p_bb_calc = currentPitcher.isRelief ? base_bb * reliefe_factor : base_bb;
    if (!currentPitcher.isRelief && currentPitcher.balls > 100) {
        p_bb_calc += (currentPitcher.balls - 100) * p_fatigue;
    }
    let final_bb_prob = Math.max(0.02, Math.min(0.35, p_bb_calc));

    let logText = `[${currentPitcher.balls}球目] ${offenseTeam} ${batter.name} vs ${currentPitcher.name} -> `;
    let rand = Math.random();

    if (rand < final_bb_prob) {
        logText += `🟢 <span class="hit-badge" style="background:#48bb78;">四死球</span> フォアボール。`;
        let runsGained = advanceRunners("BB");
        currentInningRuns += runsGained;
        currentPitcher.runsAllowed += runsGained;
    } else if (rand < final_bb_prob + base_so) {
        outs++;
        logText += `❌ <span class="out-badge">三振</span> 見逃し三振！ (${outs}アウト)`;
    } else {
        // 打球発生
        let rand_type = Math.random() * (gb_p + fb_p + ld_p);
        let hitType = rand_type < gb_p ? "GB" : (rand_type < gb_p + fb_p ? "FB" : "LD");
        
        // どこに打球が飛んだかを判定
        let fielderIdx = getDefenseResponsible(hitType);
        // 守備側の該当する野手の個別のUZR、エラー率を取得
        let fielder = getDefenseData(defenseTeam, fielderIdx);

        let actual_barrel = base_barrel * batter.barrelMod;
        
        if ((hitType === "FB" || hitType === "LD") && Math.random() < actual_barrel) {
            logText += `🔥 <span class="barrel-badge">バレル炸裂!!</span> 打球はバックスクリーンへ突き刺さるホームラン！`;
            let runsGained = advanceRunners("HR");
            currentInningRuns += runsGained;
            currentPitcher.runsAllowed += runsGained;
        } else {
            // 通常打球：飛んだ守備位置の「個別UZR」を反映
            let baseHitChance = hitType === "GB" ? 0.24 : (hitType === "FB" ? 0.16 : 0.68);
            baseHitChance *= batter.contactMod;
            
            // UZRによるヒット補正 (UZRが+10ならヒット確率を6%下げるなど、個別能力が直接作用)
            let defenseCorrection = - (fielder.uzr * 0.006);
            let finalHitChance = Math.max(0.05, Math.min(0.90, baseHitChance + defenseCorrection));

            if (Math.random() < finalHitChance) {
                let hitRand = Math.random();
                let hitKind = "1B";
                if (hitRand < 0.05) hitKind = "3B";      
                else if (hitRand < 0.25) hitKind = "2B"; 
                
                let kindText = hitKind === "1B" ? "シングルヒット" : (hitKind === "2B" ? "ツーベース" : "スリーベース");
                logText += `🔥 <span class="hit-badge">${kindText}</span> 打球は${fielder.posName}の横を鋭く抜けていった！`;
                
                let runsGained = advanceRunners(hitKind);
                currentInningRuns += runsGained;
                currentPitcher.runsAllowed += runsGained;
            } else {
                // 守備範囲内！ 続いて該当野手の「個別エラー率」を判定
                if (Math.random() < fielder.err) {
                    logText += `⚠️ <span class="error-badge">失策 (${fielder.posName})</span> 正面の打球をファンブル！エラーで出塁を許す。`;
                    let runsGained = advanceRunners("1B");
                    currentInningRuns += runsGained;
                    currentPitcher.runsAllowed += runsGained;
                } else {
                    // 正常に捕球完了。アウト・ゲッツー・犠飛の処理
                    if (hitType === "GB" && outs < 2 && bases[0]) {
                        if (Math.random() < 0.5) {
                            outs += 2;
                            bases[0] = false; 
                            if (bases[2]) { currentInningRuns++; bases[2] = false; }
                            if (bases[1]) { bases[2] = true; bases[1] = false; }
                            logText += `❌❌ <span class="out-badge" style="background:#e53e3e;">ゲッツー!</span> ${fielder.posName}が軽快にさばいてダブルプレー！ (${outs}アウト)`;
                        } else {
                            outs++;
                            bases[0] = true; 
                            logText += `❌ <span class="out-badge">内野ゴロ</span> ${fielder.posName}が2塁へ送球しフォースアウト。打者は残る。(${outs}アウト)`;
                        }
                    } else if (hitType === "FB" && outs < 2 && bases[2] && Math.random() < 0.7) {
                        outs++;
                        currentInningRuns++;
                        bases[2] = false;
                        logText += `▲ <span class="out-badge" style="background:#3182ce;">犠牲フライ</span> ${fielder.posName}が掴むも、3塁ランナーがタッチアップ生還！ (${outs}アウト)`;
                    } else {
                        outs++;
                        logText += `❌ <span class="out-badge">${fielder.posName}フライ</span> 打球は${fielder.posName}のグラブに収まった。(${outs}アウト)`;
                    }
                }
            }
        }
    }

    // スコアボード更新
    if (isTop) {
        awayScore[inning - 1] = currentInningRuns;
        document.getElementById(`a${inning}`).innerText = currentInningRuns;
    } else {
        homeScore[inning - 1] = currentInningRuns;
        document.getElementById(`h${inning}`).innerText = currentInningRuns;
    }
    
    let totalAway = awayScore.reduce((a,b)=>a+b, 0);
    let totalHome = homeScore.reduce((a,b)=>a+b, 0);
    document.getElementById("away_runs").innerText = totalAway;
    document.getElementById("home_runs").innerText = totalHome;

    appendLog(logText + "\n");

    if (isTop) awayOrder = (awayOrder + 1) % 9;
    else homeOrder = (homeOrder + 1) % 9;

    if (currentPitcher.runsAllowed >= 6) {
        appendLog(`\n💥 【投手炎上】${currentPitcher.name}がノックアウト。緊急交代です！\n`);
        currentPitcher.name = `${defenseTeam}リリーフ`;
        currentPitcher.balls = 0;
        currentPitcher.isRelief = true;
        currentPitcher.runsAllowed = 0;
    }

    if (outs >= 3) {
        appendLog(`\nチェンジ！ この回の${offenseTeam}の得点は ${currentInningRuns} 点でした。\n\n`);
        if (checkGameOver(totalAway, totalHome)) return;

        outs = 0; currentInningRuns = 0; bases = [false, false, false];

        if (isTop) {
            isTop = false; 
            document.getElementById(`h${inning}`).innerText = "0"; 
        } else {
            isTop = true; inning++; 
            if (inning <= 9) document.getElementById(`a${inning}`).innerText = "0";
        }
    } else {
        if (!isTop && inning >= 9 && totalHome > totalAway) {
            checkGameOver(totalAway, totalHome);
            return;
        }
    }

    updateDisplay();
}

function advanceRunners(hitKind) {
    let runs = 0;
    if (hitKind === "BB") {
        if (bases[0] && bases[1] && bases[2]) { runs++; }
        else if (bases[0] && bases[1]) { bases[2] = true; }
        else if (bases[0]) { bases[1] = true; }
        bases[0] = true;
    } else if (hitKind === "1B") {
        if (bases[2]) { runs++; bases[2] = false; }
        if (bases[1]) { runs++; bases[1] = false; }
        if (bases[0]) {
            if (Math.random() < 0.5) { bases[2] = true; } 
            else { bases[1] = true; }
        }
        bases[0] = true;
    } else if (hitKind === "2B") {
        if (bases[2]) { runs++; bases[2] = false; }
        if (bases[1]) { runs++; bases[1] = false; }
        if (bases[0]) {
            if (Math.random() < 0.7) { runs++; } 
            else { bases[2] = true; }
            bases[0] = false;
        }
        bases[1] = true;
    } else if (hitKind === "3B") {
        runs += (bases[0]?1:0) + (bases[1]?1:0) + (bases[2]?1:0);
        bases = [false, false, true];
    } else if (hitKind === "HR") {
        runs += 1 + (bases[0]?1:0) + (bases[1]?1:0) + (bases[2]?1:0);
        bases = [false, false, false];
    }
    return runs;
}

function checkGameOver(away, home) {
    if (inning >= 9 && isTop && outs === 0 && currentInningRuns === 0 && home > away) {
        endGame(`試合終了！ ${home} - ${away} で HOMEチームの勝利！ (9回表ウラなし)`);
        return true;
    }
    if (inning >= 9 && !isTop && home > away) {
        endGame(`試合終了！ ${home} - ${away} で HOMEチームのサヨナラ勝利！ ＼(🏆)／`);
        return true;
    }
    if (inning >= 9 && outs >= 3 && !isTop) {
        if (away > home) {
            endGame(`試合終了！ ${away} - ${home} で AWAYチームの勝利！`);
            return true;
        } else if (home === away) {
            endGame(`試合終了！ ${away} - ${home} で 引き分けです！`);
            return true;
        }
    }
    return false;
}

function endGame(message) {
    gameOver = true;
    document.getElementById("current_inning_text").innerText = "試合終了";
    document.getElementById("play_btn").innerText = "試合終了";
    document.getElementById("play_btn").disabled = true;
    appendLog(`\n👑 <b>${message}</b>`);
    
    const b1 = bases[0] ? "◆" : "◇";
    const b2 = bases[1] ? "◆" : "◇";
    const b3 = bases[2] ? "◆" : "◇";
    document.getElementById("runners_text").innerText = `${b3} ${b2} ${b1}`;
    document.getElementById("outs_text").innerText = `- アウト`;
}

function appendLog(text) {
    const logDiv = document.getElementById("simLog");
    logDiv.innerHTML += text;
    document.getElementById("resultArea").style.display = "block";
    logDiv.scrollTop = logDiv.scrollHeight; 
}

// 初期起動時にエディタを生成
generateRosterRows();
updateDisplay();
</script>
