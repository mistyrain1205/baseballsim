<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - 統合プロフェッショナル版</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; color: #2d3748; }
        .container { max-width: 1200px; margin: auto; }
        .grid-main { display: grid; grid-template-columns: 250px 1fr; gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 4px; background: #3182ce; color: white; font-weight: bold; }
        button:hover { background: #2b6cb0; }
        .stats-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        .stats-table th { background: #2d3748; color: white; padding: 8px; }
        .stats-table td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: center; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { padding: 8px 16px; cursor: pointer; background: #e2e8f0; border: none; border-radius: 4px; }
        .tab-btn.active { background: #3182ce; color: white; }
    </style>
    <script src="names.js"></script>
</head>
<body>

<div class="container">
    <h1>Baseball Tycoon: リーグ進行 <span id="game_progress">0 / 143</span></h1>
    
    <div class="grid-main">
        <div class="panel">
            <h3>コントロール</h3>
            <div class="controls">
                <button onclick="runGames(1)">1試合進行</button>
                <button onclick="runGames(6)">1週間進行</button>
                <button onclick="runGames(143)">シーズン全進行</button>
                <button onclick="resetSeason()" style="background:#718096;">シーズンリセット</button>
            </div>
            <hr>
            <h3>表示設定</h3>
            <select id="team_select" onchange="updateUI()" style="width:100%; padding:8px;">
                <option value="大阪">大阪</option><option value="東京">東京</option>
                <option value="横浜">横浜</option><option value="西海">西海</option>
                <option value="京都">京都</option><option value="浪速">浪速</option>
            </select>
        </div>

        <div class="panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('standings', this)">順位表</button>
                <button class="tab-btn" onclick="showTab('batters', this)">野手リーダー</button>
                <button class="tab-btn" onclick="showTab('pitchers', this)">投手リーダー</button>
            </div>

            <div id="standings" class="tab-content active">
                <table class="stats-table">
                    <thead><tr><th>順位</th><th>チーム</th><th>勝</th><th>敗</th><th>分</th><th>勝率</th></tr></thead>
                    <tbody id="standings_body"></tbody>
                </table>
            </div>

            <div id="batters" class="tab-content">
                <table class="stats-table">
                    <thead><tr><th>チーム</th><th>名前</th><th>打率</th><th>安打</th><th>HR</th></tr></thead>
                    <tbody id="batting_body"></tbody>
                </table>
            </div>

            <div id="pitchers" class="tab-content">
                <table class="stats-table">
                    <thead><tr><th>チーム</th><th>名前</th><th>防御率</th><th>回</th><th>奪三振</th></tr></thead>
                    <tbody id="pitching_body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
// --- シミュレーション・ロジック ---
const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];
let totalGamesPlayed = 0;
let teams = teamNames.map(name => ({
    name, wins: 0, losses: 0, draws: 0,
    batters: Array.from({length: 9}, () => ({ name: generateRandomPlayerName(), stats: { ab: 0, hits: 0, hr: 0 } })),
    pitchers: Array.from({length: 6}, () => ({ name: generateRandomPlayerName(), stats: { ipOuts: 0, er: 0, so: 0 } }))
}));

function simulateMatch(away, home) {
    let scoreAway = 0, scoreHome = 0;
    for (let i = 0; i < 18; i++) {
        let team = (i % 2 === 0) ? away : home;
        let p = (i % 2 === 0) ? home.pitchers[0] : away.pitchers[0];
        let outs = 0;
        while (outs < 3) {
            let b = team.batters[Math.floor(Math.random()*9)];
            b.stats.ab++;
            let roll = Math.random();
            if (roll < 0.25) b.stats.hits++;
            else if (roll < 0.30) { b.stats.hr++; if(i%2===0) scoreAway++; else scoreHome++; }
            else { outs++; p.stats.so++; }
            p.stats.ipOuts++;
        }
    }
    if (scoreAway > scoreHome) { away.wins++; home.losses++; }
    else if (scoreHome > scoreAway) { home.wins++; away.losses++; }
    else { away.draws++; home.draws++; }
}

function runGames(count) {
    for(let i = 0; i < count; i++) {
        if(totalGamesPlayed >= 143) break;
        simulateMatch(teams[totalGamesPlayed % 6], teams[(totalGamesPlayed + 1) % 6]);
        totalGamesPlayed++;
    }
    updateUI();
}

function showTab(id, el) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
}

function updateUI() {
    document.getElementById("game_progress").innerText = `${totalGamesPlayed} / 143`;
    
    // 順位表
    let sorted = [...teams].sort((a,b) => b.wins - a.wins);
    document.getElementById("standings_body").innerHTML = sorted.map((t, i) => 
        `<tr><td>${i+1}</td><td>${t.name}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.draws}</td><td>${(t.wins/(t.wins+t.losses||1)).toFixed(3)}</td></tr>`
    ).join("");

    // 野手リーダー
    let bList = teams.flatMap(t => t.batters.map(b => ({tName: t.name, b})))
        .sort((a,b) => (b.b.stats.hits/Math.max(b.b.stats.ab,1)) - (a.b.stats.hits/Math.max(a.b.stats.ab,1)));
    document.getElementById("batting_body").innerHTML = bList.slice(0, 10).map(item => 
        `<tr><td>${item.tName}</td><td>${item.b.name}</td><td>${(item.b.stats.hits/Math.max(item.b.stats.ab,1)).toFixed(3)}</td><td>${item.b.stats.hits}</td><td>${item.b.stats.hr}</td></tr>`
    ).join("");

    // 投手リーダー
    let pList = teams.flatMap(t => t.pitchers.map(p => ({tName: t.name, p})))
        .filter(item => item.p.stats.ipOuts > 0)
        .sort((a,b) => (a.p.stats.er*9/(a.p.stats.ipOuts/3||1)) - (b.p.stats.er*9/(b.p.stats.ipOuts/3||1)));
    document.getElementById("pitching_body").innerHTML = pList.slice(0, 10).map(item => 
        `<tr><td>${item.tName}</td><td>${item.p.name}</td><td>${(item.p.stats.er*9/(Math.max(item.p.stats.ipOuts/3,1))).toFixed(2)}</td><td>${(item.p.stats.ipOuts/3).toFixed(1)}</td><td>${item.p.stats.so}</td></tr>`
    ).join("");
}
updateUI();
</script>
</body>
</html>
