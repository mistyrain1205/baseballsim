<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>Baseball Tycoon</title></head>
<body>
    <h1>進行度: <span id="current_game_count">0</span></h1>
    <button onclick="playNextRound()">試合進行</button>

    <h2>リーグ順位表</h2>
    <table>
        <thead><tr><th>順位</th><th>チーム</th><th>勝</th></tr></thead>
        <tbody id="standings_body"></tbody>
    </table>

    <h2>個人成績</h2>
    <table id="batting_stats_table">
        <thead><tr><th>選手名</th><th>打率</th><th>WAR</th></tr></thead>
        <tbody></tbody>
    </table>

    <h3>直近の試合結果</h3>
<table style="font-size: 0.78em;">
    <tbody id="quick_match_results">
        <tr><td>試合を進行してください</td></tr>
    </tbody>
</table>

    <script src="names.js"></script>
    <script src="data.js"></script>
    <script src="simulator.js"></script>
    <script src="draft.js"></script>
</body>
</html>
