<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - 修正済み</title>
</head>
<body>
    <h1>進行度: <span id="current_game_count">0</span></h1>
    <button onclick="playNextRound()">試合進行</button>

    <h2>リーグ順位表</h2>
    <table><thead><tr><th>チーム</th><th>勝</th></tr></thead><tbody id="standings_body"></tbody></table>

    <h2>個人成績</h2>
    <table id="batting_stats_table">
        <thead><tr><th>選手名</th><th>打率</th><th>WAR</th></tr></thead>
        <tbody></tbody>
    </table>

<script>
let totalGamesPlayed = 0;
let MAX_GAMES = 143;
let teams = [
    { name: "大阪", wins: 0, batters: [{name:"田中", stats:{ab:0, hits:0, war:0, avg:0}}] },
    { name: "東京", wins: 0, batters: [{name:"佐藤", stats:{ab:0, hits:0, war:0, avg:0}}] }
];

function simulateRound() {
    if (totalGamesPlayed >= MAX_GAMES) return;
    teams.forEach(t => {
        t.batters.forEach(b => {
            b.stats.ab += 1;
            if(Math.random() > 0.7) b.stats.hits += 1;
        });
        if (Math.random() > 0.5) t.wins++;
    });
    totalGamesPlayed++;
}

function updateUIAll() {
    document.getElementById("current_game_count").innerText = totalGamesPlayed;
    
    // 順位表更新
    let sBody = document.getElementById("standings_body");
    sBody.innerHTML = teams.map(t => `<tr><td>${t.name}</td><td>${t.wins}</td></tr>`).join("");
    
    // 打撃成績更新
    let bBody = document.querySelector("#batting_stats_table tbody");
    bBody.innerHTML = "";
    teams.forEach(t => {
        t.batters.forEach(b => {
            let avg = b.stats.ab > 0 ? (b.stats.hits / b.stats.ab) : 0;
            let war = (avg - 0.250) * 20;
            bBody.innerHTML += `<tr><td>${b.name}</td><td>${avg.toFixed(3)}</td><td>${war.toFixed(1)}</td></tr>`;
        });
    });
}

function playNextRound() {
    simulateRound();
    updateUIAll();
}
</script>
</body>
</html>
