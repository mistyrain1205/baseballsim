<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon</title>
</head>
<body>
    <h1>進行度: <span id="status">0 / 429</span></h1>
    <button onclick="runGames(1)">1試合進行</button>
    <button onclick="resetSeason()">リセット</button>

    <table border="1">
        <thead>
            <tr><th>チーム</th><th>勝</th><th>敗</th><th>分</th><th>試</th></tr>
        </thead>
        <tbody id="standings_body"></tbody>
    </table>

    <script src="names.js"></script>
    <script>
        const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];
        let totalGamesPlayed = 0;
        let teams = [];
        let fullSeasonSchedule = [];

        function initSeason() {
            teams = teamNames.map(name => ({
                name, wins: 0, losses: 0, draws: 0
            }));
            fullSeasonSchedule = [];
            let base = [];
            for(let i=0; i<6; i++) for(let j=i+1; j<6; j++) base.push([i,j]);
            for(let k=0; k<29; k++) fullSeasonSchedule.push(...base);
            fullSeasonSchedule = fullSeasonSchedule.slice(0, 429).sort(() => Math.random() - 0.5);
            totalGamesPlayed = 0;
        }

        function runGames(count) {
            let limit = Math.min(totalGamesPlayed + count, 429);
            while (totalGamesPlayed < limit) {
                let pair = fullSeasonSchedule[totalGamesPlayed];
                let away = teams[pair[0]];
                let home = teams[pair[1]];
                if (Math.random() > 0.5) { away.wins++; home.losses++; }
                else { home.wins++; away.losses++; }
                totalGamesPlayed++;
            }
            updateUI();
        }

        function resetSeason() { initSeason(); updateUI(); }

        function updateUI() {
            document.getElementById("status").innerText = totalGamesPlayed + " / 429";
            document.getElementById("standings_body").innerHTML = teams.map(t => 
                `<tr><td>${t.name}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.draws}</td><td>${t.wins + t.losses + t.draws}</td></tr>`
            ).join("");
        }

        initSeason();
        updateUI();
    </script>
</body>
</html>
