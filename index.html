<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - 統合完全版</title>
    <script src="names.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls, .settings { margin-bottom: 20px; padding: 15px; border-bottom: 2px solid #eee; display: flex; gap: 10px; flex-wrap: wrap; }
        .settings { background: #edf2f7; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #2d3748; color: white; padding: 10px; font-size: 0.85em; }
        td { padding: 8px; border: 1px solid #ddd; text-align: center; font-size: 0.9em; }
        input { width: 60px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Baseball Tycoon: <span id="status">0 / 429</span></h1>
    
    <div class="settings">
        <div>ヒット率: <input type="number" id="rateHit" value="0.280" step="0.005"></div>
        <div>HR率: <input type="number" id="rateHr" value="0.035" step="0.005"></div>
        <div>三振率: <input type="number" id="rateSo" value="0.300" step="0.005"></div>
    </div>

    <div class="controls">
        <button onclick="runGames(1)">1試合進行</button>
        <button onclick="runGames(429)">全進行</button>
        <button onclick="resetSeason()" style="background:#e53e3e; color:white;">リセット</button>
    </div>

    <h2>リーグ順位</h2>
    <table id="standings_table">
        <thead><tr><th>順位</th><th>チーム</th><th>勝</th><th>敗</th><th>分</th><th>試</th><th>勝率</th></tr></thead>
        <tbody id="standings_body"></tbody>
    </table>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div><h2>野手リーダー</h2><table id="bat_table"><thead><tr><th>名前</th><th>打率</th><th>HR</th></tr></thead><tbody></tbody></table></div>
        <div><h2>投手リーダー</h2><table id="pit_table"><thead><tr><th>名前</th><th>防御率</th><th>回</th><th>奪三振</th></tr></thead><tbody></tbody></table></div>
    </div>
</div>

<script>
const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];
let totalGamesPlayed = 0;
let teams = [];
let fullSeasonSchedule = [];

function getRates() {
    return {
        hit: parseFloat(document.getElementById('rateHit').value),
        hr: parseFloat(document.getElementById('rateHr').value),
        so: parseFloat(document.getElementById('rateSo').value)
    };
}

function initSeason() {
    teams = teamNames.map(name => ({
        name, wins: 0, losses: 0, draws: 0,
        pitcherIndex: 0,
        batters: Array.from({length: 9}, () => ({ 
            name: typeof generateRandomPlayerName === 'function' ? generateRandomPlayerName() : "不明", 
            stats: { ab: 0, hits: 0, hr: 0 } 
        })),
        pitchers: Array.from({length: 6}, () => ({ 
            name: typeof generateRandomPlayerName === 'function' ? generateRandomPlayerName() : "不明", 
            stats: { ipOuts: 0, er: 0, so: 0 } 
        }))
    }));

    fullSeasonSchedule = [];
    let basePairs = [];
    for(let i = 0; i < 6; i++) {
        for(let j = i + 1; j < 6; j++) basePairs.push([i, j]);
    }
    for(let k = 0; k < 29; k++) fullSeasonSchedule.push(...basePairs);
    fullSeasonSchedule = fullSeasonSchedule.slice(0, 429).sort(() => Math.random() - 0.5);
    totalGamesPlayed = 0;
}

function simulateMatch(away, home) {
    let scoreAway = 0, scoreHome = 0;
    let awayPitcher = away.pitchers[away.pitcherIndex];
    let homePitcher = home.pitchers[home.pitcherIndex];

    for (let inning = 1; inning <= 9; inning++) {
        scoreAway += playHalf(away, homePitcher);
        scoreHome += playHalf(home, awayPitcher);
    }
    
    away.pitcherIndex = (away.pitcherIndex + 1) % 6;
    home.pitcherIndex = (home.pitcherIndex + 1) % 6;

    if (scoreAway > scoreHome) { away.wins++; home.losses++; }
    else if (scoreHome > scoreAway) { home.wins++; away.losses++; }
    else { away.draws++; home.draws++; }
}

function playHalf(battingTeam, pitcher) {
    let outs = 0, runs = 0;
    let r = getRates();
    pitcher.stats.ipOuts += 3;
    while (outs < 3) {
        let b = battingTeam.batters[Math.floor(Math.random() * 9)];
        b.stats.ab++;
        let roll = Math.random();
        if (roll < r.hit) { b.stats.hits++; } 
        else if (roll < r.hit + r.hr) { b.stats.hr++; runs++; pitcher.stats.er++; } 
        else if (roll < r.hit + r.hr + r.so) { outs++; pitcher.stats.so++; }
        else { outs++; }
    }
    return runs;
}

function runGames(count) {
    let limit = Math.min(totalGamesPlayed + count, 429);
    while (totalGamesPlayed < limit) {
        let pair = fullSeasonSchedule[totalGamesPlayed];
        simulateMatch(teams[pair[0]], teams[pair[1]]);
        totalGamesPlayed++;
    }
    updateUI();
}

function resetSeason() {
    initSeason();
    updateUI();
}

function updateUI() {
    document.getElementById("status").innerText = `${totalGamesPlayed} / 429`;
    
    let sorted = [...teams].sort((a,b) => b.wins - a.wins);
    document.getElementById("standings_body").innerHTML = sorted.map((t, i) => {
        let played = t.wins + t.losses + t.draws;
        return `<tr><td>${i+1}</td><td>${t.name}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.draws}</td><td>${played}</td><td>${(t.wins / Math.max(played, 1)).toFixed(3)}</td></tr>`;
    }).join("");

    let bList = teams.flatMap(t => t.batters).sort((a,b) => (b.stats.hits/Math.max(b.stats.ab,1)) - (a.stats.hits/Math.max(a.stats.ab,1)));
    document.querySelector("#bat_table tbody").innerHTML = bList.slice(0, 5).map(b => 
        `<tr><td>${b.name}</td><td>${(b.stats.hits/Math.max(b.stats.ab,1)).toFixed(3)}</td><td>${b.stats.hr}</td></tr>`).join("");

    let pList = teams.flatMap(t => t.pitchers)
        .filter(p => p.stats.ipOuts > 0)
        .sort((a,b) => ((a.stats.er * 27) / a.stats.ipOuts) - ((b.stats.er * 27) / b.stats.ipOuts));

    document.querySelector("#pit_table tbody").innerHTML = pList.slice(0, 5).map(p => 
        `<tr><td>${p.name}</td><td>${((p.stats.er * 27) / p.stats.ipOuts).toFixed(2)}</td><td>${(p.stats.ipOuts / 3).toFixed(1)}</td><td>${p.stats.so}</td></tr>`).join("");
}

initSeason();
updateUI();
</script>
</body>
</html>
