<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム・野球対決シミュレーター (守備指標対応版)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1a4a75;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }
        .card h2 {
            margin-top: 0;
            color: #2c5282;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
            font-size: 1.3em;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            background: #2f855a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.2em;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-bottom: 25px;
        }
        button:hover {
            background: #22543d;
        }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            background: #f7fafc;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
        }
        .result-title {
            font-weight: bold;
            font-size: 1.4em;
            color: #2b6cb0;
            margin-bottom: 15px;
            border-bottom: 1px solid #cbd5e0;
            padding-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #edf2f7;
        }
        .log {
            background: #1a202c;
            color: #fff;
            padding: 20px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1.1em;
            line-height: 1.6;
            margin-top: 15px;
            white-space: pre-wrap;
        }
        .defense-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .hit-badge {
            background: #e53e3e;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .out-badge {
            background: #3182ce;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>野球対決シミュレーター (球数・打球・守備指標対応)</h1>

    <div class="grid">
        <div class="card">
            <h2>投手データ</h2>
            <div class="form-group">
                <label>現在の球数</label>
                <input type="number" id="p_balls" value="85" min="0">
            </div>
            <div class="form-group">
                <label>基準四死球率 (%)</label>
                <input type="number" id="p_bb" value="8.0" step="0.1">
            </div>
            <div class="form-group">
                <label>球数による四死球率の増加係数 (100球超〜 1球ごと加算%)</label>
                <input type="number" id="p_fatigue" value="0.05" step="0.01">
            </div>
        </div>

        <div class="card">
            <h2>打者データ</h2>
            <div class="form-group">
                <label>対戦ごとの打席数 (1〜5打席目)</label>
                <input type="number" id="b_order" value="3" min="1" max="5">
            </div>
            <div class="form-group">
                <label>基準四死球率 (%)</label>
                <input type="number" id="b_bb" value="10.0" step="0.1">
            </div>
            <div class="form-group">
                <label>打席回数による四死球率の上昇係数 (1打席ごと上昇%)</label>
                <input type="number" id="b_eye" value="0.5" step="0.1">
            </div>
        </div>
    </div>

    <div class="card" style="margin-bottom: 25px;">
        <h2>打球タイプ・方向配分設定 (%)</h2>
        <div class="grid" style="grid-template-columns: 1fr 1fr 1fr; margin-bottom: 10px;">
            <div>
                <label>ゴロ (GB) %</label>
                <input type="number" id="hit_gb" value="45">
            </div>
            <div>
                <label>フライ (FB) %</label>
                <input type="number" id="hit_fb" value="35">
            </div>
            <div>
                <label>ライナー (LD) %</label>
                <input type="number" id="hit_ld" value="20">
            </div>
        </div>
        <div class="grid" style="grid-template-columns: 1fr 1fr 1fr; margin-bottom: 0;">
            <div>
                <label>左翼方向 %</label>
                <input type="number" id="dir_left" value="35">
            </div>
            <div>
                <label>中堅方向 %</label>
                <input type="number" id="dir_center" value="40">
            </div>
            <div>
                <label>右翼方向 %</label>
                <input type="number" id="dir_right" value="25">
            </div>
        </div>
    </div>

    <div class="card" style="margin-bottom: 25px; background: #f0fff4; border-color: #c6f6d5;">
        <h2>野手陣の守備指標設定 (UZR基準 / 0が平均)</h2>
        <p style="font-size: 0.85em; color: #4a5568; margin-top: -10px;">プラス値＝名手（安打を阻止しやすい）、マイナス値＝守備難（安打になりやすい）</p>
        <div class="defense-grid">
            <div class="form-group"><label>三塁手 (3B)</label><input type="number" id="uzr_3b" value="5.0" step="0.5"></div>
            <div class="form-group"><label>遊撃手 (SS)</label><input type="number" id="uzr_ss" value="10.0" step="0.5"></div>
            <div class="form-group"><label>左翼手 (LF)</label><input type="number" id="uzr_lf" value="-2.0" step="0.5"></div>
            
            <div class="form-group"><label>投手 (P)</label><input type="number" id="uzr_p" value="0.0" step="0.5"></div>
            <div class="form-group"><label>二塁手 (2B)</label><input type="number" id="uzr_2b" value="3.0" step="0.5"></div>
            <div class="form-group"><label>中堅手 (CF)</label><input type="number" id="uzr_cf" value="8.0" step="0.5"></div>
            
            <div class="form-group"><label>一塁手 (1B)</label><input type="number" id="uzr_1b" value="-1.0" step="0.5"></div>
            <div class="form-group"></div> <div class="form-group"><label>右翼手 (RF)</label><input type="number" id="uzr_rf" value="-4.0" step="0.5"></div>
        </div>
    </div>

    <button onclick="simulateMatch()">対決をシミュレートする</button>

    <div class="result-box" id="resultArea" style="display:none;">
        <div class="result-title">【シミュレーション結果】</div>
        <table>
            <tr>
                <th>補正後 投手四死球率</th>
                <td id="res_p_bb">0%</td>
                <th>補正後 打者四死球率</th>
                <td id="res_b_bb">0%</td>
            </tr>
            <tr style="background: #ebf8ff; font-weight: bold;">
                <th>この対戦での四死球確率</th>
                <td id="res_final_bb" style="color: #c53030;">0%</td>
                <th>フィールドに飛ぶ確率</th>
                <td id="res_final_bip">0%</td>
            </tr>
        </table>

        <div class="log" id="simLog"></div>
    </div>
</div>

<script>
function simulateMatch() {
    // --- 1. 入力値の取得 ---
    const p_balls = parseFloat(document.getElementById('p_balls').value);
    const p_bb_base = parseFloat(document.getElementById('p_bb').value) / 100;
    const p_fatigue = parseFloat(document.getElementById('p_fatigue').value) / 100;

    const b_order = parseInt(document.getElementById('b_order').value);
    const b_bb_base = parseFloat(document.getElementById('b_bb').value) / 100;
    const b_eye = parseFloat(document.getElementById('b_eye').value) / 100;

    const gb_p = parseFloat(document.getElementById('hit_gb').value);
    const fb_p = parseFloat(document.getElementById('hit_fb').value);
    const ld_p = parseFloat(document.getElementById('hit_ld').value);

    const dir_l = parseFloat(document.getElementById('dir_left').value);
    const dir_c = parseFloat(document.getElementById('dir_center').value);
    const dir_r = parseFloat(document.getElementById('dir_right').value);

    // 守備指標の取得
    const uzr = {
        'P':  parseFloat(document.getElementById('uzr_p').value),
        '1B': parseFloat(document.getElementById('uzr_1b').value),
        '2B': parseFloat(document.getElementById('uzr_2b').value),
        '3B': parseFloat(document.getElementById('uzr_3b').value),
        'SS': parseFloat(document.getElementById('uzr_ss').value),
        'LF': parseFloat(document.getElementById('uzr_lf').value),
        'CF': parseFloat(document.getElementById('uzr_cf').value),
        'RF': parseFloat(document.getElementById('uzr_rf').value)
    };

    const league_bb = 0.08;

    // --- 2. 四死球率の補正と対数オッズ計算 ---
    let p_bb_calc = p_bb_base + (p_balls > 100 ? (p_balls - 100) * p_fatigue : 0);
    let b_bb_calc = b_bb_base + ((b_order - 1) * b_eye);

    const numerator = (p_bb_calc * b_bb_calc) / league_bb;
    const denominator = numerator + ((1 - p_bb_calc) * (1 - b_bb_calc) / (1 - league_bb));
    const final_bb_probability = numerator / denominator;

    document.getElementById('res_p_bb').innerText = (p_bb_calc * 100).toFixed(2) + "%";
    document.getElementById('res_b_bb').innerText = (b_bb_calc * 100).toFixed(2) + "%";
    document.getElementById('res_final_bb').innerText = (final_bb_probability * 100).toFixed(2) + "%";
    document.getElementById('res_final_bip').innerText = ((1 - final_bb_probability) * 100).toFixed(2) + "%";

    // --- 3. 対決シミュレート ---
    const random_outcome = Math.random();
    let resultText = "";

    if (random_outcome < final_bb_probability) {
        resultText = "🟢 【結果】 四死球 (Walk)\n投手がコントロールを乱したか、打者がよく見極めて出塁しました。";
    } else {
        // --- 4. 打球の発生と守備処理 ---
        // 打球種類の決定
        const rand_type = Math.random() * (gb_p + fb_p + ld_p);
        let hitType = ""; // GB, FB, LD
        let hitTypeJa = "";
        if (rand_type < gb_p) { hitType = "GB"; hitTypeJa = "ゴロ"; }
        else if (rand_type < gb_p + fb_p) { hitType = "FB"; hitTypeJa = "フライ"; }
        else { hitType = "LD"; hitTypeJa = "ライナー"; }

        // 打球方向の決定
        const rand_dir = Math.random() * (dir_l + dir_c + dir_r);
        let dirJa = "";
        let targetPosition = ""; // 担当ポジション

        if (rand_dir < dir_l) {
            dirJa = "レフト（左翼）方向";
            targetPosition = (hitType === "GB") ? "3B" : "LF"; // ゴロならサード、それ以外はレフト
        } else if (rand_dir < dir_l + dir_c) {
            dirJa = "センター（中堅）方向";
            // センター方向のゴロはピッチャー、セカンド、ショートのいずれか
            if (hitType === "GB") {
                let r = Math.random();
                targetPosition = r < 0.2 ? "P" : (r < 0.6 ? "SS" : "2B");
            } else {
                targetPosition = "CF";
            }
        } else {
            dirJa = "ライト（右翼）方向";
            targetPosition = (hitType === "GB") ? "1B" : "RF"; // ゴロならファースト、それ以外はライト
        }

        // --- 5. 守備指標(UZR)によるアウト/ヒットの判定 ---
        // 各打球タイプのデフォルト「ヒットになる確率 (BABIP想定)」
        // ライナーは高確率、ゴロはそこそこ、フライは低め
        let baseHitChance = 0;
        if (hitType === "GB") baseHitChance = 0.24; // ゴロの基準安打率
        if (hitType === "FB") baseHitChance = 0.15; // フライの基準安打率
        if (hitType === "LD") baseHitChance = 0.68; // ライナーの基準安打率

        // UZRの値を使ってヒット確率を補正
        // UZRが+10ならヒット確率を約5%下げる、-10なら5%上げる（簡易数式）
        let positionUzr = uzr[targetPosition];
        let defenseCorrection = - (positionUzr * 0.005);
        let finalHitChance = baseHitChance + defenseCorrection;
        
        // 確率の安全ガード (0%〜100%の間に収める)
        finalHitChance = Math.max(0.02, Math.min(0.98, finalHitChance));

        // 安打かアウトかのダイスロール
        const defenseRoll = Math.random();
        let playResult = "";
        let positionNameMap = {'P':'投手','1B':'一塁手','2B':'二塁手','3B':'三塁手','SS':'遊撃手','LF':'左翼手','CF':'中堅手','RF':'右翼手'};
        let currentFielder = positionNameMap[targetPosition];

        if (defenseRoll < finalHitChance) {
            playResult = `🔥 <span class="hit-badge">ヒット (Hit)</span>\n${currentFielder}(UZR: ${positionUzr > 0 ? '+' : ''}${positionUzr})の守備範囲を破る痛烈な当たり！安打になりました。`;
        } else {
            let outAction = "";
            if (hitType === "GB") outAction = "がゴロを軽快にさばいてファーストアウト！";
            if (hitType === "FB") outAction = "が落下点に入り、がっちり掴んでフライアウト！";
            if (hitType === "LD") outAction = "が鋭いライナーを正面、またはジャンピングキャッチ！";
            playResult = `アウト (Out)\n${currentFielder}(UZR: ${positionUzr > 0 ? '+' : ''}${positionUzr})${outAction}`;
        }

        resultText = `⚾ 【打球発生】\n`;
        resultText += `打球種類: ${hitTypeJa} [${hitType}]\n`;
        resultText += `打球方向: ${dirJa}\n`;
        resultText += `----------------------------------------\n`;
        resultText += playResult;
    }

    // 結果ログの出力
    document.getElementById('simLog').innerHTML = resultText;
    document.getElementById('resultArea').style.display = "block";
}
</script>

</body>
</html>
