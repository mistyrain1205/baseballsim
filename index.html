<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - チーム選択・ダッシュボード版</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1000px; margin: auto; }
        .dashboard { display: grid; grid-template-columns: 250px 1fr; gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 10px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #2d3748; color: white; padding: 8px; font-size: 0.8em; }
        td { padding: 6px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 0.9em; }
    </style>
</head>
<body>
<div class="container">
    <h1>Baseball Tycoon: シーズン進行 <span id="current_game_count">0</span>/143</h1>
    
    <div class="dashboard">
        <div class="panel">
            <h3>チーム設定</h3>
            <select id="team_select" onchange="updateUI()">
                <option value="大阪">大阪</option>
                <option value="東京">東京</option>
                <option value="横浜">横浜</option>
                <option value="西海">西海</option>
                <option value="京都">京都</option>
                <option value="浪速">浪速</option>
            </select>
            <button onclick="playMatch()">1試合進行</button>
            <button onclick="playSeason()" style="background:#e53e3e; color:white;">シーズン終了</button>
        </div>

        <div class="panel">
            <h2 id="my_team_name">チーム情報</h2>
            <h3>野手成績</h3>
            <table id="batting_table"><thead><tr><th>名前</th><th>打率</th><th>安打</th></tr></thead><tbody></tbody></table>
            <h3>投手成績</h3>
            <table id="pitching_table"><thead><tr><th>名前</th><th>役割</th><th>回</th><th>防御率</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
</div>

<script>
const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];
let totalGamesPlayed = 0;
let teams = teamNames.map(name => ({
    name,
    batters: Array.from({length: 9}, (_, i) => ({ name: "打者"+(i+1), stats: { ab: 0, hits: 0 } })),
    pitchers: Array.from({length: 8}, (_, i) => ({ 
        name: "投手"+(i+1), role: i < 5 ? "先発" : "リリーフ", 
        lastPitched: -10, stats: { ipOuts: 0, er: 0 } 
    }))
}));

function playMatch() {
    if (totalGamesPlayed >= 143) return;
    teams.forEach(t => {
        t.batters.forEach(b => { b.stats.ab++; if(Math.random() > 0.7) b.stats.hits++; });
        let starter = t.pitchers.filter(p => p.role === "先発").find(p => (totalGamesPlayed - p.lastPitched) > 5) || t.pitchers[5];
        starter.lastPitched = totalGamesPlayed;
        starter.stats.ipOuts += 18;
        starter.stats.er += Math.floor(Math.random() * 4);
    });
    totalGamesPlayed++;
    updateUI();
}

function playSeason() { while(totalGamesPlayed < 143) playMatch(); }

function updateUI() {
    let selectedName = document.getElementById("team_select").value;
    let myTeam = teams.find(t => t.name === selectedName);
    document.getElementById("my_team_name").innerText = myTeam.name + " の成績";
    document.getElementById("current_game_count").innerText = totalGamesPlayed;
    
    document.querySelector("#batting_table tbody").innerHTML = myTeam.batters.map(b => 
        `<tr><td>${b.name}</td><td>${(b.stats.hits/(b.stats.ab||1)).toFixed(3)}</td><td>${b.stats.hits}</td></tr>`
    ).join("");

    document.querySelector("#pitching_table tbody").innerHTML = myTeam.pitchers.map(p => 
        `<tr><td>${p.name}</td><td>${p.role}</td><td>${(p.stats.ipOuts/3).toFixed(1)}</td><td>${(p.stats.er*9/(Math.max(p.stats.ipOuts/3,1))).toFixed(2)}</td></tr>`
    ).join("");
}
updateUI();
</script>
</body>
</html>
