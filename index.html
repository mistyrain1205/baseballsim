<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - 投手ローテ・野手統合版</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #2d3748; color: white; padding: 8px; font-size: 0.8em; }
        td { padding: 6px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 0.9em; }
        button { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h1>進行度: <span id="current_game_count">0</span> / 143</h1>
    <button onclick="playMatch()">1試合進行</button>
    <button onclick="playSeason()">シーズン終了</button>

    <div class="grid">
        <div>
            <h2>野手成績</h2>
            <table id="batting_table">
                <thead><tr><th>チーム</th><th>名前</th><th>打率</th><th>WAR</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div>
            <h2>投手成績 (先発ローテ & 継投)</h2>
            <table id="pitching_table">
                <thead><tr><th>チーム</th><th>名前</th><th>役割</th><th>回</th><th>防御率</th><th>WAR</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];
let totalGamesPlayed = 0;

// 全チームデータ
let teams = teamNames.map(name => ({
    name, rotationIdx: 0,
    batters: Array.from({length: 9}, (_, i) => ({ name: "打者"+(i+1), stats: { ab: 0, hits: 0 } })),
    pitchers: Array.from({length: 6}, (_, i) => ({ 
        name: "投手"+(i+1), role: i===0?"先発":(i===5?"守護神":"リリーフ"), 
        stats: { ipOuts: 0, so: 0, er: 0 } 
    }))
}));

function playMatch() {
    if (totalGamesPlayed >= 143) return;

    teams.forEach(t => {
        // 野手成績更新
        t.batters.forEach(b => { 
            b.stats.ab++; if(Math.random() > 0.7) b.stats.hits++; 
        });

        // 投手成績更新（ローテーション & 継投）
        let starters = t.pitchers.filter(p => p.role === "先発");
        let starter = starters[t.rotationIdx % starters.length];
        
        starter.stats.ipOuts += 18; // 先発6回
        starter.stats.so += Math.floor(Math.random()*6);
        starter.stats.er += Math.floor(Math.random()*3);
        
        let relief = t.pitchers.find(p => p.role === "リリーフ");
        relief.stats.ipOuts += 9; // リリーフ3回
        
        t.rotationIdx++; 
    });
    totalGamesPlayed++;
    updateUI();
}

function playSeason() { while(totalGamesPlayed < 143) playMatch(); }

function updateUI() {
    document.getElementById("current_game_count").innerText = totalGamesPlayed;
    
    // 野手表示
    document.querySelector("#batting_table tbody").innerHTML = teams.flatMap(t => 
        t.batters.map(b => `<tr><td>${t.name}</td><td>${b.name}</td><td>${(b.stats.hits/(b.stats.ab||1)).toFixed(3)}</td><td>${(b.stats.hits*0.05).toFixed(1)}</td></tr>`)
    ).join("");

    // 投手表示
    document.querySelector("#pitching_table tbody").innerHTML = teams.flatMap(t => 
        t.pitchers.map(p => `<tr><td>${t.name}</td><td>${p.name}</td><td>${p.role}</td><td>${(p.stats.ipOuts/3).toFixed(1)}</td><td>${(p.stats.er*9/(Math.max(p.stats.ipOuts/3,1))).toFixed(2)}</td><td>${(p.stats.so*0.05).toFixed(1)}</td></tr>`)
    ).join("");
}
updateUI();
</script>
</body>
</html>
