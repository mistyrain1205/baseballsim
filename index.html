<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - 最終完全版</title>
    <script src="names.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .controls, .settings { margin-bottom: 20px; padding: 15px; border-bottom: 2px solid #eee; display: flex; gap: 15px; flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #2d3748; color: white; padding: 12px; }
        td { padding: 10px; border: 1px solid #e2e8f0; text-align: center; }
        .roster-card { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container" id="main_game_container">
    <h1>Baseball Tycoon: <span id="status">0 / 429</span></h1>
    <div class="controls">
        <button onclick="runGames(1)">1試合進行</button>
        <button onclick="runGames(429)">全試合一括</button>
        <button id="btn_to_offseason" onclick="showOffseason()" style="display:none; background:#3182ce; color:white;">オフシーズンへ</button>
    </div>
    
    <div id="roster_view" class="roster-card"></div>
    
    <h2>順位表</h2>
    <table id="standings_table">
        <thead><tr><th>チーム</th><th>勝</th><th>敗</th><th>勝率</th></tr></thead>
        <tbody id="standings_body"></tbody>
    </table>
</div>

<div id="offseason_container" class="container" style="display: none;">
    <h2>戦力外通告＆ドラフト</h2>
    <div id="offseason_release_zone">
        <h3>戦力外通告</h3>
        <table id="release_table"><thead><tr><th>選択</th><th>名前</th><th>WAR</th></tr></thead><tbody id="release_body"></tbody></table>
        <button onclick="finalizeReleases()">通告してドラフトへ</button>
    </div>
    <div id="draft_interaction_zone" style="display: none;">
        <h3>ドラフト候補生</h3>
        <table id="draft_table"><thead><tr><th>名前</th><th>能力(Pot)</th><th>獲得</th></tr></thead><tbody id="draft_body"></tbody></table>
    </div>
</div>

<script>
const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];
let totalGamesPlayed = 0;
let teams = [];

function init() {
    teams = teamNames.map((name, i) => ({
        id: i, name, wins: 0, losses: 0,
        batters: Array.from({length:9}, () => ({ name: generateRandomPlayerName(), war: Math.random()*2 })),
        pitchers: Array.from({length:6}, () => ({ name: generateRandomPlayerName(), war: Math.random()*2 }))
    }));
    updateUI();
}

function runGames(n) {
    totalGamesPlayed = Math.min(totalGamesPlayed + n, 429);
    teams.forEach(t => { t.wins += Math.floor(Math.random()*2); t.losses += Math.floor(Math.random()*2); });
    updateUI();
    if(totalGamesPlayed >= 429) document.getElementById("btn_to_offseason").style.display = "inline-block";
}

// 選手名鑑と分析を表示
function updateUI() {
    document.getElementById("status").innerText = totalGamesPlayed + " / 429";
    document.getElementById("standings_body").innerHTML = teams.map(t => `<tr><td>${t.name}</td><td>${t.wins}</td><td>${t.losses}</td><td>${(t.wins/(t.wins+t.losses+0.1)).toFixed(3)}</td></tr>`).join("");
    
    // 自チームのロスター分析
    let myTeam = teams[0];
    let batWar = myTeam.batters.reduce((s, b) => s + b.war, 0);
    let pitWar = myTeam.pitchers.reduce((s, p) => s + p.war, 0);
    document.getElementById("roster_view").innerHTML = `
        <h3>自チーム分析: ${myTeam.name}</h3>
        <p>総合WAR: 野手 ${batWar.toFixed(1)} / 投手 ${pitWar.toFixed(1)} 
           (${batWar < pitWar ? "助言: 打線を強化しましょう！" : "助言: 投手陣の補強を優先しましょう！"})</p>
    `;
}

function showOffseason() {
    document.getElementById("main_game_container").style.display = "none";
    document.getElementById("offseason_container").style.display = "block";
    document.getElementById("release_body").innerHTML = teams[0].batters.map((b, i) => 
        `<tr><td><input type="checkbox" class="rel-check" value="${i}"></td><td>${b.name}</td><td>${b.war.toFixed(1)}</td></tr>`
    ).join("");
}

function finalizeReleases() {
    let checked = Array.from(document.querySelectorAll('.rel-check:checked')).map(el => parseInt(el.value));
    teams[0].batters = teams[0].batters.filter((_, i) => !checked.includes(i));
    document.getElementById("offseason_release_zone").style.display = "none";
    document.getElementById("draft_interaction_zone").style.display = "block";
    renderDraftPool();
}

function renderDraftPool() {
    let candidates = Array.from({length:5}, () => ({ name: generateRandomPlayerName(), pot: Math.floor(Math.random()*50)+50 }));
    document.getElementById("draft_body").innerHTML = candidates.map(c => `<tr>
        <td>${c.name}</td><td>${c.pot}</td>
        <td><button onclick="selectDraftPlayer('${c.name}', ${c.pot})">獲得</button></td>
    </tr>`).join("");
}

function selectDraftPlayer(name, pot) {
    teams[0].batters.push({ name: name, war: pot/50 });
    alert(name + "を獲得！新シーズンを開幕します。");
    teams.forEach(t => { t.wins = 0; t.losses = 0; });
    totalGamesPlayed = 0;
    document.getElementById("offseason_container").style.display = "none";
    document.getElementById("main_game_container").style.display = "block";
    document.getElementById("btn_to_offseason").style.display = "none";
    updateUI();
}

init();
</script>
</body>
</html>
