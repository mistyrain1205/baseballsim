<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>143試合完走確認用</title>
</head>
<body>
    <h1>進行度: <span id="status">0 / 143</span></h1>
    <button id="runBtn">シーズン全進行 (強制実行)</button>

    <script>
        document.getElementById('runBtn').onclick = function() {
            let wins = [0,0,0,0,0,0];
            let losses = [0,0,0,0,0,0];
            let draws = [0,0,0,0,0,0];
            
            // 強制的に143回回す
            for(let i = 0; i < 143; i++) {
                let tA = i % 6;
                let tB = (i + 1 + Math.floor(i/6)) % 6;
                
                // 簡易勝敗
                let r = Math.random();
                if(r < 0.45) { wins[tA]++; losses[tB]++; }
                else if(r < 0.9) { wins[tB]++; losses[tA]++; }
                else { draws[tA]++; draws[tB]++; }
            }
            
            document.getElementById('status').innerText = "143 / 143";
            console.log("全試合完了:", wins, losses, draws);
            alert("143試合完了しました。コンソールを確認してください。");
        };
    </script>
</body>
</html>
