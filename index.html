<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本格派・野球試合シミュレーター (打撃・守備個別能力設定版)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1150px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1a4a75;
            margin-bottom: 20px;
        }
        /* スコアボード */
        .scoreboard {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            background: #1a202c;
            color: white;
            border-radius: 8px;
            overflow: hidden;
        }
        .scoreboard th, .scoreboard td {
            border: 1px solid #4a5568;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        .scoreboard th { background: #2d3748; color: #a0aec0; }
        .scoreboard td.runs { color: #ecc94b; font-size: 1.2em; }

        /* 試合中継ステータス表示 */
        .game-status-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: #fffaf0;
            border: 2px solid #feebc8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }
        .status-item { font-size: 1.1em; align-self: center; }
        .diamond { color: #4a5568; font-size: 1.2em; letter-spacing: 2px; }

        .grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }
        .card h2 {
            margin-top: 0;
            color: #2c5282;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
            font-size: 1.2em;
        }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 3px; font-size: 0.85em; }
        input[type="number"] {
            width: 100%; padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; box-sizing: border-box;
        }
        
        /* 選手個別設定用の簡易テーブル */
        .player-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82em;
            margin-top: 10px;
        }
        .player-table th, .player-table td {
            padding: 5px 4px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .player-table th { background: #edf2f7; color: #4a5568; }
        .player-table input { width: 50px; padding: 3px; text-align: center; border: 1px solid #cbd5e0; border-radius: 3px; }

        /* タブ切り替え */
        .tabs { display: flex; margin-bottom: -1px; background: #e2e8f0; padding: 5px 5px 0 5px; border-radius: 6px 6px 0 0; }
        .tab {
            padding: 6px 12px; border: 1px solid #cbd5e0; background: #edf2f7;
            cursor: pointer; border-radius: 4px 4px 0 0; font-weight: bold; font-size: 0.85em; margin-right: 4px;
        }
        .tab.active { background: #f8fafc; border-bottom: 1px solid #f8fafc; color: #2c5282; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .btn-play {
            display: block; width: 100%; padding: 15px; background: #2b6cb0; color: white;
            border: none; border-radius: 6px; font-size: 1.3em; cursor: pointer; font-weight: bold;
            transition: background 0.2s; margin-bottom: 15px;
        }
        .btn-play:hover { background: #2c5282; }
        .btn-reset {
            display: block; width: 100%; padding: 8px; background: #e53e3e; color: white;
            border: none; border-radius: 6px; font-size: 0.9em; cursor: pointer; font-weight: bold;
            margin-bottom: 25px;
        }

        .result-box {
            margin-top: 25px; padding: 25px; background: #f7fafc; border: 2px solid #cbd5e0; border-radius: 8px;
        }
        .log {
            background: #1a202c; color: #fff; padding: 20px; border-radius: 6px;
            font-family: monospace; font-size: 1.1em; line-height: 1.6; margin-top: 15px;
            white-space: pre-wrap; max-height: 400px; overflow-y: auto;
        }
        .hit-badge { background: #e53e3e; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .barrel-badge { background: #d69e2e; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .error-badge { background: #b7791f; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .out-badge { background: #4a5568; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>本格派・野球試合シミュレーター (選手能力完全個別化版)</h1>

    <table class="scoreboard">
        <thead>
            <tr>
                <th style="width: 150px;">チーム</th>
                <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th>
                <th style="width: 60px; background: #2d3748;">R</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>AWAY (先攻)</td>
                <td id="a1">-</td><td id="a2">-</td><td id="a3">-</td><td id="a4">-</td><td id="a5">-</td><td id="a6">-</td><td id="a7">-</td><td id="a8">-</td><td id="a9">-</td>
                <td id="away_runs" class="runs">0</td>
            </tr>
            <tr>
                <td>HOME (後攻)</td>
                <td id="h1">-</td><td id="h2">-</td><td id="h3">-</td><td id="h4">-</td><td id="h5">-</td><td id="h6">-</td><td id="h7">-</td><td id="h8">-</td><td id="h9">-</td>
                <td id="home_runs" class="runs">0</td>
            </tr>
        </tbody>
    </table>

    <div class="game-status-box">
        <div class="status-item" id="current_inning_text">試合前</div>
        <div class="status-item" id="outs_text">0 アウト</div>
        <div class="status-item" id="pitcher_status_text">投手: -</div>
        <div class="status-item diamond" id="runners_text">◇ ◇ ◇</div>
    </div>
    <div style="text-align: center; margin-bottom: 15px; font-weight: bold; color: #2c5282;" id="batter_status_text"></div>

    <button class="btn-play" id="play_btn" onclick="playNextBatter()">プレイ開始</button>
    <button class="btn-reset" onclick="resetGame()">試合をリセット</button>

    <div class="grid">
        <div class="card">
            <h2>環境・基本グラウンド設定</h2>
            <div class="form-group"><label>ゴロ (GB) %</label><input type="number" id="hit_gb" value="45"></div>
            <div class="form-group"><label>フライ (FB) %</label><input type="number" id="hit_fb" value="35"></div>
            <div class="form-group"><label>ライナー (LD) %</label><input type="number" id="hit_ld" value="20"></div>
            <div class="form-group"><label>先発 100球超の四死球率増加係数</label><input type="number" id="p_fatigue" value="0.05" step="0.01"></div>
            <div class="form-group"><label>リリーフ 四死球率補正値 (優秀=0.9)</label><input type="number" id="reliefe_factor" value="0.9" step="0.1"></div>
        </div>

        <div class="card" style="display: flex; flex-direction: column; padding: 10px;">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('away-bat-tab', this)">AWAY打撃</div>
                <div class="tab" onclick="switchTab('away-def-tab', this)">AWAY守備</div>
                <div class="tab" onclick="switchTab('home-bat-tab', this)">HOME打撃</div>
                <div class="tab" onclick="switchTab('home-def-tab', this)">HOME守備</div>
            </div>
            
            <div id="away-bat-tab" class="tab-content active">
                <table class="player-table">
                    <thead>
                        <tr><th>打順</th><th>守備</th><th>選球眼(BB%)</th><th>コンタクト(SO%)</th><th>バレル(%)</th><th>長打力(IsoP)</th></tr>
                    </thead>
                    <tbody id="away-bat-rows"></tbody>
                </table>
            </div>
            <div id="away-def-tab" class="tab-content">
                <table class="player-table">
                    <thead>
                        <tr><th>打順</th><th>守備位置</th><th>UZR (範囲)</th><th>エラー率(%)</th></tr>
                    </thead>
                    <tbody id="away-def-rows"></tbody>
                </table>
            </div>
            <div id="home-bat-tab" class="tab-content">
                <table class="player-table">
                    <thead>
                        <tr><th>打順</th><th>守備</th><th>選球眼(BB%)</th><th>コンタクト(SO%)</th><th>バレル(%)</th><th>長打力(IsoP)</th></tr>
                    </thead>
                    <tbody id="home-bat-rows"></tbody>
                </table>
            </div>
            <div id="home-def-tab" class="tab-content">
                <table class="player-table">
                    <thead>
                        <tr><th>打順</th><th>守備位置</th><th>UZR (範囲)</th><th>エラー率(%)</th></tr>
                    </thead>
                    <tbody id="home-def-rows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="result-box" id="resultArea" style="display:none;">
        <div class="result-title" id="log_title" style="font-weight: bold; color: #1a4a75;">実況ログ</div>
        <div class="log" id="simLog"></div>
    </div>
</div>

<script>
const positions = ["捕手", "一塁手", "二塁手", "三塁手", "遊撃手", "左翼手", "中堅手", "右翼手", "投手"];

// プロの平均的な打順別データをデフォルト初期値として設定（不平等化）
const defaultAwayRoster = [
    { pos: "捕手", bb: 7.5,  so: 20.0, barrel: 6.0,  isop: 15.0, uzr: 0.0,  err: 1.5 }, // 1番
    { pos: "一塁手", bb: 9.0,  so: 15.0, barrel: 5.0,  isop: 12.0, uzr: -1.0, err: 2.0 }, // 2番
    { pos: "二塁手", bb: 11.0, so: 18.0, barrel: 14.0, isop: 25.0, uzr: 2.0,  err: 2.5 }, // 3番クリーンナップ
    { pos: "三塁手", bb: 13.0, so: 22.0, barrel: 18.0, isop: 30.0, uzr: 1.0,  err: 3.0 }, // 4番主砲
    { pos: "遊撃手", bb: 10.0, so: 19.0, barrel: 12.0, isop: 22.0, uzr: 3.5,  err: 3.5 }, // 5番
    { pos: "左翼手", bb: 8.0,  so: 17.0, barrel: 8.0,  isop: 18.0, uzr: 0.5,  err: 1.5 }, // 6番
    { pos: "中堅手", bb: 7.0,  so: 21.0, barrel: 7.0,  isop: 14.0, uzr: 4.0,  err: 1.2 }, // 7番
    { pos: "右翼手", bb: 6.5,  so: 24.0, barrel: 5.0,  isop: 10.0, uzr: 1.5,  err: 1.8 }, // 8番
    { pos: "投手",   bb: 3.0,  so: 40.0, barrel: 1.0,  isop: 2.0,  uzr: 0.0,  err: 2.0 }  // 9番投手
];

const defaultHomeRoster = [
    { pos: "捕手", bb: 8.0,  so: 16.0, barrel: 7.0,  isop: 14.0, uzr: 0.5,  err: 1.2 },
    { pos: "一塁手", bb: 10.0, so: 14.0, barrel: 6.0,  isop: 13.0, uzr: -0.5, err: 1.8 },
    { pos: "二塁手", bb: 12.0, so: 17.0, barrel: 15.0, isop: 26.0, uzr: 1.5,  err: 2.2 },
    { pos: "三塁手", bb: 14.0, so: 20.0, barrel: 20.0, isop: 32.0, uzr: 2.0,  err: 2.8 },
    { pos: "遊撃手", bb: 9.5,  so: 18.0, barrel: 11.0, isop: 20.0, uzr: 4.0,  err: 3.2 },
    { pos: "左翼手", bb: 7.5,  so: 18.0, barrel: 9.0,  isop: 17.0, uzr: -1.0, err: 2.0 },
    { pos: "中堅手", bb: 7.0,  so: 22.0, barrel: 6.5,  isop: 12.0, uzr: 3.0,  err: 1.5 },
    { pos: "右翼手", bb: 6.0,  so: 25.0, barrel: 4.5,  isop: 9.0,  uzr: 2.0,  err: 1.5 },
    { pos: "投手",   bb: 2.5,  so: 45.0, barrel: 0.5,  isop: 1.0,  uzr: 0.0,  err: 2.0 }
];

function generateRosterRows() {
    const containers = {
        "away-bat": document.getElementById("away-bat-rows"),
        "away-def": document.getElementById("away-def-rows"),
        "home-bat": document.getElementById("home-bat-rows"),
        "home-def": document.getElementById("home-def-rows")
    };
    
    Object.values(containers).forEach(c => c.innerHTML = "");

    for(let i=0; i<9; i++) {
        // AWAY 打撃・守備
        containers["away-bat"].innerHTML += `<tr><td>${i+1}</td><td><b>${positions[i]}</b></td><td><input type="number" id="away_bb_${i}" value="${defaultAwayRoster[i].bb}" step="0.5"></td><td><input type="number" id="away_so_${i}" value="${defaultAwayRoster[i].so}" step="0.5"></td><td><input type="number" id="away_barrel_${i}" value="${defaultAwayRoster[i].barrel}" step="0.5"></td><td><input type="number" id="away_isop_${i}" value="${defaultAwayRoster[i].isop}" step="1"></td></tr>`;
        containers["away-def"].innerHTML += `<tr><td>${i+1}</td><td><b>${positions[i]}</b></td><td><input type="number" id="away_uzr_${i}" value="${defaultAwayRoster[i].uzr}" step="0.5"></td><td><input type="number" id="away_err_${i}" value="${defaultAwayRoster[i].err}" step="0.1"></td></tr>`;
        // HOME 打撃・守備
        containers["home-bat"].innerHTML += `<tr><td>${i+1}</td><td><b>${positions[i]}</b></td><td><input type="number" id="home_bb_${i}" value="${defaultHomeRoster[i].bb}" step="0.5"></td><td><input type="number" id="home_so_${i}" value="${defaultHomeRoster[i].so}" step="0.5"></td><td><input type="number" id="home_barrel_${i}" value="${defaultHomeRoster[i].barrel}" step="0.5"></td><td><input type="number" id="home_isop_${i}" value="${defaultHomeRoster[i].isop}" step="1"></td></tr>`;
        containers["home-def"].innerHTML += `<tr><td>${i+1}</td><td><b>${positions[i]}</b></td><td><input type="number" id="home_uzr_${i}" value="${defaultHomeRoster[i].uzr}" step="0.5"></td><td><input type="number" id="home_err_${i}" value="${defaultHomeRoster[i].err}" step="0.1"></td></tr>`;
    }
}

function switchTab(tabId, el) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    el.classList.add('active');
}

// 進行変数
let inning = 1, isTop = true, gameOver = false, gameStarted = false;
let awayScore = Array(9).fill(0), homeScore = Array(9).fill(0);
let currentInningRuns = 0, outs = 0, bases = [false, false, false];
let awayOrder = 0, homeOrder = 0;
let pitcherState = {
    away: { name: "AWAY先発", balls: 0, runsAllowed: 0, isRelief: false },
    home: { name: "HOME先発", balls: 0, runsAllowed: 0, isRelief: false }
};

// 画面から打者の個別ステータスを取得する関数
function getBatterData(team, orderIdx) {
    const prefix = team === "AWAY" ? "away" : "home";
    return {
        name: `${orderIdx+1}番(${positions[orderIdx]})`,
        bb: (parseFloat(document.getElementById(`${prefix}_bb_${orderIdx}`).value) || 0) / 100,
        so: (parseFloat(document.getElementById(`${prefix}_so_${orderIdx}`).value) || 0) / 100,
        barrel: (parseFloat(document.getElementById(`${prefix}_barrel_${orderIdx}`).value) || 0) / 100,
        isop: parseFloat(document.getElementById(`${prefix}_isop_${orderIdx}`).value) || 0
    };
}

function getDefenseData(team, posIdx) {
    const prefix = team === "AWAY" ? "away" : "home";
    return {
        posName: positions[posIdx],
        uzr: parseFloat(document.getElementById(`${prefix}_uzr_${posIdx}`).value) || 0,
        err: (parseFloat(document.getElementById(`${prefix}_err_${posIdx}`).value) || 0) / 100
    };
}

function getDefenseResponsible(hitType) {
    let rand = Math.random();
    if (hitType === "GB") {
        if (rand < 0.15) return 8; // 投手
        if (rand < 0.20) return 0; // 捕手
        if (rand < 0.35) return 1; // 一塁手
        if (rand < 0.60) return 2; // 二塁手
        if (rand < 0.75) return 3; // 三塁手
        return 4; // 遊撃手
    } else {
        if (rand < 0.25) return 5; // 左翼手
        if (rand < 0.60) return 6; // 中堅手
        if (rand < 0.85) return 7; // 右翼手
        if (rand < 0.90) return 4; // 遊撃手
        return 3; // 三塁手
    }
}

function resetGame() {
    inning = 1; isTop = true; gameOver = false; gameStarted = false;
    awayScore = Array(9).fill(0); homeScore = Array(9).fill(0);
    currentInningRuns = 0; outs = 0; bases = [false, false, false];
    awayOrder = 0; homeOrder = 0;
    pitcherState = {
        away: { name: "AWAY先発", balls: 0, runsAllowed: 0, isRelief: false },
        home: { name: "HOME先発", balls: 0, runsAllowed: 0, isRelief: false }
    };
    for(let i=1; i<=9; i++) {
        document.getElementById(`a${i}`).innerText = "-";
        document.getElementById(`h${i}`).innerText = "-";
    }
    document.getElementById("away_runs").innerText = "0";
    document.getElementById("home_runs").innerText = "0";
    document.getElementById("simLog").innerText = "";
    document.getElementById("resultArea").style.display = "none";
    updateDisplay();
}

function updateDisplay() {
    if (!gameStarted) {
        document.getElementById("current_inning_text").innerText = "試合前";
        document.getElementById("play_btn").innerText = "試合開始";
        document.getElementById("batter_status_text").innerText = "";
        return;
    }
    const offenseTeam = isTop ? "AWAY" : "HOME";
    const currentPitcher = isTop ? pitcherState.home : pitcherState.away;
    const batter = getBatterData(offenseTeam, isTop ? awayOrder : homeOrder);

    document.getElementById("current_inning_text").innerText = `${inning}回${isTop ? '表' : '裏'}`;
    document.getElementById("outs_text").innerText = `${outs} アウト`;
    document.getElementById("pitcher_status_text").innerText = `投手: ${currentPitcher.name} (${currentPitcher.balls}球)`;
    
    const b1 = bases[0] ? "◆" : "◇";
    const b2 = bases[1] ? "◆" : "◇";
    const b3 = bases[2] ? "◆" : "◇";
    document.getElementById("runners_text").innerText = `${b3} ${b2} ${b1}`;
    document.getElementById("batter_status_text").innerText = `打者: ${offenseTeam} ${batter.name}`;
    document.getElementById("play_btn").innerText = "1打席シミュレート";
}

function playNextBatter() {
    if (gameOver) return;
    if (!gameStarted) {
        gameStarted = true;
        appendLog(`=== 試合開始 ===\n`);
        document.getElementById("a1").innerText = "0";
        updateDisplay();
        return;
    }

    let offenseTeam = isTop ? "AWAY" : "HOME";
    let defenseTeam = isTop ? "HOME" : "AWAY";
    let currentPitcher = isTop ? pitcherState.home : pitcherState.away;
    let currentOrderIdx = isTop ? awayOrder : homeOrder;
    
    // 個別打者データの取得
    let batter = getBatterData(offenseTeam, currentOrderIdx);

    // 継投判定
    if (!currentPitcher.isRelief && ((currentPitcher.balls >= 100 && (bases[1] || bases[2])) || currentPitcher.balls >= 105)) {
        appendLog(`\n🚨 【投手交代】${defenseTeam}はリリーフ投手を送ります。\n`);
        currentPitcher.name = `${defenseTeam}リリーフ`;
        currentPitcher.balls = 0; currentPitcher.isRelief = true; currentPitcher.runsAllowed = 0;
    }

    currentPitcher.balls += Math.floor(Math.random() * 5) + 2;

    const gb_p = parseFloat(document.getElementById('hit_gb').value);
    const fb_p = parseFloat(document.getElementById('hit_fb').value);
    const ld_p = parseFloat(document.getElementById('hit_ld').value);
    const p_fatigue = parseFloat(document.getElementById('p_fatigue').value) / 100;
    const reliefe_factor = parseFloat(document.getElementById('reliefe_factor').value);

    // 疲労による四死球率補正
    let final_bb_prob = currentPitcher.isRelief ? batter.bb * reliefe_factor : batter.bb;
    if (!currentPitcher.isRelief && currentPitcher.balls > 100) {
        final_bb_prob += (currentPitcher.balls - 100) * p_fatigue;
    }
    final_bb_prob = Math.max(0.02, Math.min(0.40, final_bb_prob));

    let logText = `[${currentPitcher.balls}球目] ${offenseTeam} ${batter.name} vs ${currentPitcher.name} -> `;
    let rand = Math.random();

    if (rand < final_bb_prob) {
        // ① 四死球（選球眼が影響）
        logText += `🟢 <span class="hit-badge" style="background:#48bb78;">四死球</span> じっくりボールを見極めてフォアボール。`;
        let runsGained = advanceRunners("BB");
        currentInningRuns += runsGained; currentPitcher.runsAllowed += runsGained;
    } else if (rand < final_bb_prob + batter.so) {
        // ② 三振（コンタクト率が影響）
        outs++;
        logText += `❌ <span class="out-badge">三振</span> 空振り三振！鋭い変化球にバットが空を切りました。(${outs}アウト)`;
    } else {
        // ③ 打球発生
        let rand_type = Math.random() * (gb_p + fb_p + ld_p);
        let hitType = rand_type < gb_p ? "GB" : (rand_type < gb_p + fb_p ? "FB" : "LD");
        let fielderIdx = getDefenseResponsible(hitType);
        let fielder = getDefenseData(defenseTeam, fielderIdx);

        if ((hitType === "FB" || hitType === "LD") && Math.random() < batter.barrel) {
            // バレル炸裂（ホームラン）
            logText += `🔥 <span class="barrel-badge">バレル炸裂!!</span> 完璧に捉えた打球は文句なしのホームラン！`;
            let runsGained = advanceRunners("HR");
            currentInningRuns += runsGained; currentPitcher.runsAllowed += runsGained;
        } else {
            // 通常ヒット判定
            let baseHitChance = hitType === "GB" ? 0.24 : (hitType === "FB" ? 0.16 : 0.68);
            let defenseCorrection = - (fielder.uzr * 0.006);
            let finalHitChance = Math.max(0.05, Math.min(0.90, baseHitChance + defenseCorrection));

            if (Math.random() < finalHitChance) {
                // ヒット発生。ここで「長打力(IsoP)」に応じて二・三塁打の確率を変動させる
                let hitRand = Math.random() * 100;
                let hitKind = "1B";
                
                // IsoPの値が大きいほど長打（2B, 3B）になりやすく調整
                if (hitRand < batter.isop * 0.1) hitKind = "3B";
                else if (hitRand < batter.isop * 0.8) hitKind = "2B";
                
                let kindText = hitKind === "1B" ? "シングルヒット" : (hitKind === "2B" ? "ツーベース" : "スリーベース");
                logText += `🔥 <span class="hit-badge">${kindText}</span> ${fielder.posName}の守備範囲を破る素晴らしい当たり！`;
                
                let runsGained = advanceRunners(hitKind);
                currentInningRuns += runsGained; currentPitcher.runsAllowed += runsGained;
            } else {
                // 凡打（守備陣のエラー判定へ）
                if (Math.random() < fielder.err) {
                    logText += `⚠️ <span class="error-badge">失策 (${fielder.posName})</span> 打球をグラブに当てながらも落球！エラー。`;
                    let runsGained = advanceRunners("1B");
                    currentInningRuns += runsGained; currentPitcher.runsAllowed += runsGained;
                } else {
                    // 通常アウト・ゲッツー・犠飛
                    if (hitType === "GB" && outs < 2 && bases[0]) {
                        if (Math.random() < 0.5) {
                            outs += 2; bases[0] = false;
                            if (bases[2]) { currentInningRuns++; bases[2] = false; }
                            if (bases[1]) { bases[2] = true; bases[1] = false; }
                            logText += `❌❌ <span class="out-badge" style="background:#e53e3e;">ゲッツー!</span> 内野ゴロをさばいてダブルプレー！ (${outs}アウト)`;
                        } else {
                            outs++; bases[0] = true;
                            logText += `❌ <span class="out-badge">内野ゴロ</span> 1塁走者が2塁でアウト。バッターは残る。(${outs}アウト)`;
                        }
                    } else if (hitType === "FB" && outs < 2 && bases[2] && Math.random() < 0.7) {
                        outs++; currentInningRuns++; bases[2] = false;
                        logText += `▲ <span class="out-badge" style="background:#3182ce;">犠牲フライ</span> 外野フライを捕球後、3塁ランナーがタッチアップ生還！ (${outs}アウト)`;
                    } else {
                        outs++;
                        logText += `❌ <span class="out-badge">${fielder.posName}ゴロ/フライ</span> しっかりと打ち取られてアウト。(${outs}アウト)`;
                    }
                }
            }
        }
    }

    // スコアボード更新
    if (isTop) {
        awayScore[inning - 1] = currentInningRuns;
        document.getElementById(`a${inning}`).innerText = currentInningRuns;
    } else {
        homeScore[inning - 1] = currentInningRuns;
        document.getElementById(`h${inning}`).innerText = currentInningRuns;
    }
    let totalAway = awayScore.reduce((a,b)=>a+b, 0);
    let totalHome = homeScore.reduce((a,b)=>a+b, 0);
    document.getElementById("away_runs").innerText = totalAway;
    document.getElementById("home_runs").innerText = totalHome;

    appendLog(logText + "\n");

    if (isTop) awayOrder = (awayOrder + 1) % 9;
    else homeOrder = (homeOrder + 1) % 9;

    if (currentPitcher.runsAllowed >= 6) {
        appendLog(`\n💥 【投手ノックアウト】大量失点によりリリーフへ緊急交代！\n`);
        currentPitcher.name = `${defenseTeam}リリーフ`;
        currentPitcher.balls = 0; currentPitcher.isRelief = true; currentPitcher.runsAllowed = 0;
    }

    if (outs >= 3) {
        appendLog(`\nチェンジ！ この回の得点: ${currentInningRuns}\n\n`);
        if (checkGameOver(totalAway, totalHome)) return;
        outs = 0; currentInningRuns = 0; bases = [false, false, false];
        if (isTop) {
            isTop = false; document.getElementById(`h${inning}`).innerText = "0";
        } else {
            isTop = true; inning++;
            if (inning <= 9) document.getElementById(`a${inning}`).innerText = "0";
        }
    } else {
        if (!isTop && inning >= 9 && totalHome > totalAway) {
            checkGameOver(totalAway, totalHome);
            return;
        }
    }
    updateDisplay();
}

function advanceRunners(hitKind) {
    let runs = 0;
    if (hitKind === "BB") {
        if (bases[0] && bases[1] && bases[2]) { runs++; }
        else if (bases[0] && bases[1]) { bases[2] = true; }
        else if (bases[0]) { bases[1] = true; }
        bases[0] = true;
    } else if (hitKind === "1B") {
        if (bases[2]) { runs++; bases[2] = false; }
        if (bases[1]) { runs++; bases[1] = false; }
        if (bases[0]) {
            if (Math.random() < 0.5) { bases[2] = true; } 
            else { bases[1] = true; }
        }
        bases[0] = true;
    } else if (hitKind === "2B") {
        if (bases[2]) { runs++; bases[2] = false; }
        if (bases[1]) { runs++; bases[1] = false; }
        if (bases[0]) {
            if (Math.random() < 0.7) { runs++; } 
            else { bases[2] = true; }
            bases[0] = false;
        }
        bases[1] = true;
    } else if (hitKind === "3B") {
        runs += (bases[0]?1:0) + (bases[1]?1:0) + (bases[2]?1:0);
        bases = [false, false, true];
    } else if (hitKind === "HR") {
        runs += 1 + (bases[0]?1:0) + (bases[1]?1:0) + (bases[2]?1:0);
        bases = [false, false, false];
    }
    return runs;
}

function checkGameOver(away, home) {
    if (inning >= 9 && isTop && outs === 0 && currentInningRuns === 0 && home > away) {
        endGame(`試合終了！ ${home} - ${away} で HOMEチームの勝利！`); return true;
    }
    if (inning >= 9 && !isTop && home > away) {
        endGame(`試合終了！ ${home} - ${away} で HOMEチームのサヨナラ勝利！`); return true;
    }
    if (inning >= 9 && outs >= 3 && !isTop) {
        if (away > home) { endGame(`試合終了！ ${away} - ${home} で AWAYチームの勝利！`); return true; }
        else if (home === away) { endGame(`試合終了！ ${away} - ${home} で 引き分けです！`); return true; }
    }
    return false;
}

function endGame(message) {
    gameOver = true;
    document.getElementById("current_inning_text").innerText = "試合終了";
    document.getElementById("play_btn").innerText = "試合終了";
    document.getElementById("play_btn").disabled = true;
    appendLog(`\n👑 <b>${message}</b>`);
}

function appendLog(text) {
    const logDiv = document.getElementById("simLog");
    logDiv.innerHTML += text;
    document.getElementById("resultArea").style.display = "block";
    logDiv.scrollTop = logDiv.scrollHeight;
}

generateRosterRows();
updateDisplay();
</script>
