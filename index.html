<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - 統合マネジメント</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; padding: 20px; background: #f0f2f5; color: #2d3748; }
        .container { max-width: 1200px; margin: auto; }
        .dashboard { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: #e2e8f0; border-radius: 5px; }
        .tab-btn.active { background: #3182ce; color: white; }
        .content { display: none; }
        .content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #2d3748; color: white; padding: 10px; font-size: 0.85em; }
        td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 0.9em; }
        button { width: 100%; padding: 12px; margin-bottom: 10px; cursor: pointer; border: none; border-radius: 5px; background: #3182ce; color: white; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>Baseball Tycoon: 進行度 <span id="current_game_count">0</span> / 143</h1>
    <div class="dashboard">
        <div class="panel">
            <h3>チーム設定</h3>
            <select id="team_select" style="width:100%; padding:10px; margin-bottom:10px;" onchange="updateUI()">
                <option value="大阪">大阪</option><option value="東京">東京</option>
                <option value="横浜">横浜</option><option value="西海">西海</option>
                <option value="京都">京都</option><option value="浪速">浪速</option>
            </select>
            <button onclick="playMatch()">1試合進行</button>
            <button onclick="playSeason()" style="background:#e53e3e;">シーズン終了</button>
        </div>
        <div class="panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('batters')">野手成績</button>
                <button class="tab-btn" onclick="showTab('pitchers')">投手成績</button>
            </div>
            <div id="batters" class="content active">
                <table id="batting_table"><thead><tr><th>名前</th><th>打率</th><th>HR</th><th>UZR</th><th>WAR</th></tr></thead><tbody></tbody></table>
            </div>
            <div id="pitchers" class="content">
                <table id="pitching_table"><thead><tr><th>名前</th><th>役割</th><th>回</th><th>防御率</th><th>疲労</th><th>WAR</th></tr></thead><tbody></tbody></table>
            </div>
        </div>
    </div>
</div>

<script>
// --- [1] データ定義 ---
const teamNames = ["大阪", "東京", "横浜", "西海", "京都", "浪速"];
let totalGamesPlayed = 0;
let teams = teamNames.map(name => ({
    name, rotationIdx: 0,
    batters: Array.from({length: 9}, (_, i) => ({ 
        name: "打者"+(i+1), stats: { ab: 0, hits: 0, hr: 0, uzr: (Math.random()*10-5).toFixed(1) } 
    })),
    pitchers: Array.from({length: 8}, (_, i) => ({ 
        name: "投手"+(i+1), role: i < 5 ? "先発" : "リリーフ", lastPitched: -10,
        fatigue: 0, stats: { ipOuts: 0, so: 0, er: 0 } 
    }))
}));

// --- [2] 試合進行ロジック ---
function playMatch() {
    if (totalGamesPlayed >= 143) return;
    teams.forEach(t => {
        t.batters.forEach(b => { 
            b.stats.ab++; if(Math.random() > 0.7) { b.stats.hits++; if(Math.random() > 0.9) b.stats.hr++; } 
        });
        
        // 投手ローテ (中5日)
        let starter = t.pitchers.filter(p => p.role === "先発").find(p => (totalGamesPlayed - p.lastPitched) > 5) || t.pitchers[5];
        starter.lastPitched = totalGamesPlayed;
        starter.stats.ipOuts += 18; 
        starter.stats.er += Math.floor(Math.random() * 4);
        
        t.pitchers.forEach(p => p.fatigue = Math.max(0, p.fatigue - 5)); // 疲労回復
    });
    totalGamesPlayed++;
    updateUI();
}

function playSeason() { while(totalGamesPlayed < 143) playMatch(); }

// --- [3] UI・表示 ---
function showTab(id) {
    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
}

function updateUI() {
    let myTeam = teams.find(t => t.name === document.getElementById("team_select").value);
    document.getElementById("current_game_count").innerText = totalGamesPlayed;
    
    document.querySelector("#batting_table tbody").innerHTML = myTeam.batters.map(b => {
        let avg = b.stats.hits / (b.stats.ab||1);
        let war = (avg-0.250)*20 + (b.stats.hr*0.5) + parseFloat(b.stats.uzr)*0.1;
        return `<tr><td>${b.name}</td><td>${avg.toFixed(3)}</td><td>${b.stats.hr}</td><td>${b.stats.uzr}</td><td>${war.toFixed(1)}</td></tr>`;
    }).join("");

    document.querySelector("#pitching_table tbody").innerHTML = myTeam.pitchers.map(p => {
        let ip = p.stats.ipOuts/3;
        let era = (p.stats.er * 9 / (ip||1));
        let war = (4.20 - era) * (ip/15) + (p.stats.so*0.05);
        return `<tr><td>${p.name}</td><td>${p.role}</td><td>${ip.toFixed(1)}</td><td>${era.toFixed(2)}</td><td>${p.fatigue}</td><td>${war.toFixed(1)}</td></tr>`;
    }).join("");
}
updateUI();
</script>
</body>
</html>
