<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Baseball Tycoon - 投手陣構築版</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 0.85em; }
        th { background: #2d3748; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h1>投手陣成績ボード (進行: <span id="current_game_count">0</span>)</h1>
    <button onclick="playNextRound()">試合進行</button>

    <h2>投手陣詳細</h2>
    <table id="pitcher_stats_table">
        <thead>
            <tr>
                <th>投手名</th><th>役割</th><th>回</th><th>奪三振</th><th>被安打</th><th>防御率</th><th>WAR</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
// --- 初期設定 ---
let teams = ["大阪", "東京", "横浜", "西海", "京都", "浪速"].map(name => ({
    name,
    pitchers: Array.from({length: 8}, (_, i) => ({
        name: "投手" + (i + 1),
        role: i === 0 ? "先発" : (i === 7 ? "守護神" : "リリーフ"),
        k9: 6 + Math.random() * 6, // 奪三振能力
        h9: 6 + Math.random() * 4, // 被安打抑制
        stats: { ipOuts: 0, so: 0, hitsAllowed: 0, er: 0, wins: 0 }
    }))
}));

let totalGamesPlayed = 0;

// --- 試合ロジック ---
function executeMatchLogic(away, home) {
    // 先発投手の登板
    let p = home.pitchers.find(p => p.role === "先発");
    
    // 試合結果計算のシミュレーション
    p.stats.ipOuts += 9; // 3イニング登板と仮定
    p.stats.so += Math.floor(p.k9 * 0.3);
    p.stats.hitsAllowed += Math.floor(p.h9 * 0.5);
    p.stats.er += Math.floor(Math.random() * 2);

    totalGamesPlayed++;
}

function playNextRound() {
    [[0,1], [2,3], [4,5]].forEach(pair => executeMatchLogic(teams[pair[0]], teams[pair[1]]));
    updateUI();
}

// --- UI更新 ---
function updateUI() {
    document.getElementById("current_game_count").innerText = totalGamesPlayed;
    let tbody = document.querySelector("#pitcher_stats_table tbody");
    tbody.innerHTML = "";

    teams.forEach(t => {
        t.pitchers.forEach(p => {
            let ip = p.stats.ipOuts / 3;
            let era = ip > 0 ? (p.stats.er * 9 / ip) : 0;
            let war = (ip / 15) + (p.stats.so * 0.1) - (p.stats.hitsAllowed * 0.05);
            
            tbody.innerHTML += `<tr>
                <td>${p.name} (${t.name})</td>
                <td>${p.role}</td>
                <td>${ip.toFixed(1)}</td>
                <td>${p.stats.so}</td>
                <td>${p.stats.hitsAllowed}</td>
                <td>${era.toFixed(2)}</td>
                <td>${war.toFixed(1)}</td>
            </tr>`;
        });
    });
}

updateUI();
</script>
</body>
</html>
